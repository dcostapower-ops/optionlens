<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stockypower</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --buy: #2ea043; --sell: #da3633; --hold: #9e6a03; --accent: #388bfd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 28px 20px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 860px; margin: 0 auto; padding: 16px 20px 60px; }
  form { display: flex; gap: 10px; margin: 16px 0 24px; }
  input[type=text] {
    flex: 1; padding: 14px 16px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px;
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button { cursor: pointer; border: 0; border-radius: 10px; font-weight: 600; }
  .primary { padding: 0 26px; font-size: 17px; background: var(--accent); color: #fff; }
  .primary:disabled { opacity: .5; cursor: default; }
  .history { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  .chip b.BUY { color: var(--buy); } .chip b.SELL { color: var(--sell); } .chip b.HOLD { color: var(--hold); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
  .card-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sym { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .badge { padding: 6px 18px; border-radius: 8px; font-size: 22px; font-weight: 800; color: #fff; }
  .badge.BUY { background: var(--buy); } .badge.SELL { background: var(--sell); } .badge.HOLD { background: var(--hold); }
  .badge.pending { background: #30363d; color: var(--muted); font-size: 15px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
  .summary { margin: 12px 0 0; font-size: 16px; }
  .status { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
  .status.done::before { animation: none; background: var(--muted); }
  @keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
  .error { color: #ff7b72; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.bullish { color: var(--buy); } td.bearish { color: var(--sell); } td.neutral { color: var(--muted); }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); padding: 12px; border-radius: 8px; max-height: 420px; overflow: auto; }
  .confirm { margin-top: 12px; padding: 12px; border: 1px solid var(--hold); border-radius: 10px; background: #1f1a0e; }
  .confirm pre { max-height: 160px; }
  .confirm button { padding: 6px 16px; margin-right: 8px; }
  .allow { background: var(--buy); color: #fff; } .deny { background: var(--sell); color: #fff; }
  .chart { margin-top: 16px; }
  .chart h4, .gallery h4 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .chart svg { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 10px; }
  .chart .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .chart .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .gallery { margin-top: 16px; }
  .gallery .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .gallery a { display: block; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .gallery img { width: 100%; display: block; }
  .gallery .cap { font-size: 12px; color: var(--muted); padding: 4px 8px; background: var(--panel); }
  .nochart { margin-top: 12px; font-size: 13px; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>Stocky<span>power</span></h1>
  <p>Enter a symbol. Stocky checks its historical data and indicators and tells you whether to buy or sell.</p>
</header>

<main>
  <form id="form" autocomplete="off">
    <input id="symbol" type="text" placeholder="AAPL" maxlength="10" required autofocus />
    <button class="primary" id="go" type="submit">Ask Stocky</button>
  </form>

  <div class="history" id="history"></div>
  <div id="results"></div>
</main>

<footer>Signals come from the Stocky agent's indicators. Not financial advice.</footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const HISTORY_KEY = "stockypower.history";

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
}
function saveHistory(entry) {
  const h = loadHistory().filter((e) => e.symbol !== entry.symbol);
  h.unshift(entry);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 30)));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  $("#history").innerHTML = h.map((e) =>
    `<button class="chip" data-sym="${esc(e.symbol)}" title="${esc(new Date(e.at).toLocaleString())}">${esc(e.symbol)} <b class="${esc(e.signal)}">${esc(e.signal)}</b></button>`
  ).join("");
}
$("#history").addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (chip) { $("#symbol").value = chip.dataset.sym; $("#form").requestSubmit(); }
});

function newCard(symbol) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <div class="sym">${esc(symbol)}</div>
      <div class="badge pending">Analyzing…</div>
      <div class="meta"></div>
    </div>
    <div class="summary"></div>
    <div class="indicators"></div>
    <div class="chart"></div>
    <div class="gallery"></div>
    <div class="confirms"></div>
    <div class="status">Connecting…</div>
    <details><summary>Stocky's full analysis</summary><pre class="raw"></pre></details>`;
  $("#results").prepend(card);
  return card;
}

// Line chart: Massive price history (solid) + Stocky's forecast (dashed) with its low/high band.
function drawForecastChart(history, forecast, signal) {
  const hist = (history || []).filter((p) => p && p.date && Number.isFinite(+p.close));
  const fc = (forecast || []).filter((p) => p && p.date && Number.isFinite(+p.price));
  if (!hist.length && !fc.length) return "";
  const W = 760, H = 300, L = 58, R = 16, T = 16, B = 34;
  const t = (d) => Date.parse(d + "T00:00:00Z");
  const xs = [...hist.map((p) => t(p.date)), ...fc.map((p) => t(p.date))];
  const vals = [
    ...hist.map((p) => +p.close),
    ...fc.flatMap((p) => [+p.price, p.low, p.high].filter((v) => v !== null && Number.isFinite(+v)).map(Number)),
  ];
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  let y0 = Math.min(...vals), y1 = Math.max(...vals); const pad = (y1 - y0) * 0.08 || Math.abs(y1) * 0.05 || 1; y0 -= pad; y1 += pad;
  const X = (d) => L + ((t(d) - x0) / (x1 - x0)) * (W - L - R);
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const pts = (arr, key) => arr.map((p) => `${X(p.date).toFixed(1)},${Y(+p[key]).toFixed(1)}`).join(" ");
  const fcColor = signal === "SELL" ? "#da3633" : signal === "BUY" ? "#2ea043" : "#d29922";
  const fmt = (v) => (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(2));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history and forecast">`;
  for (let i = 0; i <= 4; i++) {
    const v = y0 + ((y1 - y0) * i) / 4, y = Y(v).toFixed(1);
    svg += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#30363d" stroke-width="1"/>`;
    svg += `<text x="${L - 8}" y="${+y + 4}" fill="#8b949e" font-size="11" text-anchor="end">${fmt(v)}</text>`;
  }
  const band = fc.filter((p) => p.low !== null && p.high !== null);
  if (band.length > 1) {
    const up = band.map((p) => `${X(p.date).toFixed(1)},${Y(+p.high).toFixed(1)}`);
    const dn = band.slice().reverse().map((p) => `${X(p.date).toFixed(1)},${Y(+p.low).toFixed(1)}`);
    svg += `<polygon points="${[...up, ...dn].join(" ")}" fill="${fcColor}" fill-opacity="0.15" stroke="none"/>`;
  }
  if (hist.length > 1) svg += `<polyline points="${pts(hist, "close")}" fill="none" stroke="#388bfd" stroke-width="2"/>`;
  if (fc.length) {
    const start = hist.length ? [{ date: hist[hist.length - 1].date, price: hist[hist.length - 1].close }] : [];
    const line = [...start, ...fc];
    if (line.length > 1) svg += `<polyline points="${pts(line, "price")}" fill="none" stroke="${fcColor}" stroke-width="2" stroke-dasharray="6 4"/>`;
    const last = fc[fc.length - 1];
    svg += `<circle cx="${X(last.date)}" cy="${Y(+last.price)}" r="4" fill="${fcColor}"><title>${esc(last.date)}: ${fmt(+last.price)}</title></circle>`;
  }
  if (hist.length && fc.length) {
    const xn = X(hist[hist.length - 1].date).toFixed(1);
    svg += `<line x1="${xn}" x2="${xn}" y1="${T}" y2="${H - B}" stroke="#8b949e" stroke-dasharray="2 3"/>`;
    svg += `<text x="${+xn + 4}" y="${T + 10}" fill="#8b949e" font-size="11">today</text>`;
  }
  const xl = [hist[0]?.date, hist[hist.length - 1]?.date, fc[fc.length - 1]?.date].filter(Boolean);
  [...new Set(xl)].forEach((d, i, a) => {
    const anchor = i === 0 ? "start" : i === a.length - 1 ? "end" : "middle";
    svg += `<text x="${X(d).toFixed(1)}" y="${H - 12}" fill="#8b949e" font-size="11" text-anchor="${anchor}">${esc(d)}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function renderCharts(card, verdict, data) {
  const fc = verdict?.forecast || [];
  const hist = data?.history || [];
  const svg = drawForecastChart(hist, fc, verdict?.signal);
  if (svg) {
    $(".chart", card).innerHTML = `<h4>${fc.length ? `Forecast${verdict.horizon ? ` · ${esc(verdict.horizon)}` : ""}` : "Price history (Massive)"}</h4>${svg}
      <div class="legend">${hist.length ? `<span><i style="background:#388bfd"></i>Price history (Massive)</span>` : ""}${
        fc.length ? `<span><i style="background:${verdict.signal === "SELL" ? "#da3633" : verdict.signal === "BUY" ? "#2ea043" : "#d29922"}"></i>Stocky's forecast and range</span>` : ""}</div>`;
  }
  const imgs = data?.charts || [];
  if (imgs.length) {
    $(".gallery", card).innerHTML = `<h4>Stocky's charts</h4><div class="imgs">${imgs.map((c) =>
      `<a href="${esc(c.url)}" target="_blank" rel="noopener"><img src="${esc(c.url)}" alt="${esc(c.filename)}" loading="lazy"><div class="cap">${esc(c.filename)}</div></a>`
    ).join("")}</div>`;
  }
  if (!fc.length && !imgs.length) {
    const n = document.createElement("div");
    n.className = "nochart";
    n.textContent = "Stocky didn't return a forecast or any charts this time.";
    $(".gallery", card).append(n);
  }
}

function renderVerdict(card, symbol, verdict) {
  const badge = $(".badge", card);
  if (!verdict) {
    badge.className = "badge pending";
    badge.textContent = "No clear call";
    $(".summary", card).textContent = "Stocky didn't return a BUY or SELL signal. See the full analysis below.";
    $("details", card).open = true;
    return;
  }
  badge.className = `badge ${verdict.signal}`;
  badge.textContent = verdict.signal;
  const meta = [];
  if (verdict.confidence != null) meta.push(`Confidence ${verdict.confidence}%`);
  if (verdict.price != null) meta.push(`Last ${esc(verdict.price)}`);
  if (verdict.as_of) meta.push(`as of ${esc(verdict.as_of)}`);
  $(".meta", card).innerHTML = meta.join("<br>");
  $(".summary", card).textContent = verdict.summary || "";
  if (verdict.indicators?.length) {
    $(".indicators", card).innerHTML = `<table><thead><tr><th>Indicator</th><th>Value</th><th>Reading</th></tr></thead><tbody>${
      verdict.indicators.map((i) => {
        const r = String(i.reading || "").toLowerCase();
        return `<tr><td>${esc(i.name)}</td><td>${esc(i.value)}</td><td class="${esc(r)}">${esc(i.reading)}</td></tr>`;
      }).join("")
    }</tbody></table>`;
  }
  if (!verdict.structured) $("details", card).open = true;
  saveHistory({ symbol, signal: verdict.signal, at: Date.now() });
}

function showConfirm(card, data) {
  const box = document.createElement("div");
  box.className = "confirm";
  box.innerHTML = `
    <div>Stocky wants to run <b>${esc(data.name)}</b>. Allow it?</div>
    ${data.input ? `<pre>${esc(JSON.stringify(data.input, null, 2))}</pre>` : ""}
    <button class="allow">Allow</button><button class="deny">Deny</button>`;
  const answer = async (result) => {
    box.querySelectorAll("button").forEach((b) => (b.disabled = true));
    await fetch("/api/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: data.sessionId, toolUseId: data.toolUseId, result }),
    });
    box.innerHTML = `<div>${result === "allow" ? "Allowed" : "Denied"}: ${esc(data.name)}</div>`;
  };
  $(".allow", box).onclick = () => answer("allow");
  $(".deny", box).onclick = () => answer("deny");
  $(".confirms", card).append(box);
}

async function analyze(symbol) {
  const card = newCard(symbol);
  const status = $(".status", card);
  const raw = $(".raw", card);
  const setStatus = (m) => (status.textContent = m);

  const res = await fetch("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ symbol }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    $(".badge", card).textContent = "Error";
    status.className = "error";
    status.textContent = err.error;
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  let gotVerdict = false;

  const handle = (event, data) => {
    switch (event) {
      case "status": setStatus(data.message); break;
      case "session": card.dataset.session = data.id; break;
      case "tool": setStatus(`Stocky is using ${data.name}…`); break;
      case "text": raw.textContent += (raw.textContent ? "\n" : "") + data.text; break;
      case "confirm": setStatus("Waiting for your approval…"); showConfirm(card, data); break;
      case "verdict":
        gotVerdict = true;
        raw.textContent = data.text || raw.textContent;
        renderVerdict(card, symbol, data.verdict);
        renderCharts(card, data.verdict, data);
        break;
      case "error": {
        $(".badge", card).className = "badge pending";
        $(".badge", card).textContent = "Error";
        const e = document.createElement("div");
        e.className = "error";
        e.textContent = data.message;
        status.after(e);
        break;
      }
      case "done":
        status.className = "status done";
        setStatus(gotVerdict ? `Done · session ${card.dataset.session || ""}` : "Finished");
        break;
    }
  };

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) !== -1) {
      const chunk = buf.slice(0, i);
      buf = buf.slice(i + 2);
      let ev = "message", data = "";
      for (const line of chunk.split("\n")) {
        if (line.startsWith("event: ")) ev = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      if (data) { try { handle(ev, JSON.parse(data)); } catch (e) { console.error(e); } }
    }
  }
}

$("#form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const symbol = $("#symbol").value.trim().toUpperCase().replace(/^\$/, "");
  if (!symbol) return;
  $("#symbol").value = "";
  try { await analyze(symbol); } catch (e) { console.error(e); }
});

renderHistory();
</script>
</body>
</html>
