<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stockypower</title>
<script src="vendor/lightweight-charts-5.2.1.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --buy: #2ea043; --sell: #da3633; --hold: #9e6a03; --accent: #388bfd;
    --t1: #3fb950; --t2: #56d364; --s1: #f85149; --s2: #ff7b72; --fh: #58a6ff; --fl: #a371f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 24px 16px 4px; text-align: center; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 60px; }
  form { display: flex; gap: 10px; margin: 16px 0 20px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 14px 16px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px;
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button { cursor: pointer; border: 0; border-radius: 10px; font-weight: 600; font: inherit; }
  .primary { padding: 0 26px; font-size: 17px; font-weight: 600; background: var(--accent); color: #fff; }
  .history { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  .chip b.BUY { color: var(--buy); } .chip b.SELL { color: var(--sell); } .chip b.HOLD { color: var(--hold); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; }
  .card-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sym { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .badge { padding: 5px 16px; border-radius: 8px; font-size: 20px; font-weight: 800; color: #fff; }
  .badge.sm { padding: 2px 10px; font-size: 14px; border-radius: 6px; }
  .BUY { background: var(--buy); } .SELL { background: var(--sell); } .HOLD { background: var(--hold); }
  .badge.pending { background: #30363d; color: var(--muted); font-size: 15px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
  .summary { margin: 10px 0 0; font-size: 16px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
  .tab { padding: 6px 14px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); font-size: 14px; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; background: transparent; }
  .tab .dot.BUY { background: var(--buy); } .tab .dot.SELL { background: var(--sell); } .tab .dot.HOLD { background: var(--hold); }

  .levels { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 980px) { .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .lv { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; min-width: 0; }
  .lv .k { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .3px; }
  .lv .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lv .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lv.t1 .v { color: var(--t1); } .lv.t2 .v { color: var(--t2); } .lv.s1 .v { color: var(--s1); } .lv.s2 .v { color: var(--s2); }
  .lv.fh .v { color: var(--fh); } .lv.fl .v { color: var(--fl); }

  .checks { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .checks.ok { background: #0f2a17; border: 1px solid #1f6f35; }
  .checks.bad { background: #2b1d0a; border: 1px solid #9e6a03; }
  .checks ul { margin: 6px 0 0; padding-left: 20px; }
  .track { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .rationale { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .chartwrap { position: relative; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #0d1117; }
  .chart { height: 460px; }
  .legend { position: absolute; top: 8px; left: 12px; right: 90px; z-index: 3; font-size: 12px; pointer-events: none; font-variant-numeric: tabular-nums; color: var(--muted); line-height: 1.6; }
  .legend .ttl { color: var(--text); font-weight: 600; margin-right: 10px; }
  .legend span { margin-right: 10px; white-space: nowrap; }
  .legend .up { color: #3fb950; } .legend .dn { color: #f85149; }
  .keys { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .keys i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .livebar { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .livebar:empty { display: none; }
  .livebar .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .livebar .dot.off { background: #6e7681; box-shadow: none; }
  .alerts { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .alerts:empty { display: none; }
  .alert { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #1f2a3a; border: 1px solid #2f4a6b; }
  .alert.up { background: #0f2a17; border-color: #1f6f35; } .alert.dn { background: #2d1214; border-color: #7a2328; }
  .alert time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .chartbar { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; min-height: 0; }
  .chartbar:empty { display: none; }
  .mini { padding: 3px 10px; font-size: 12px; font-weight: 500; background: var(--panel2); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; }
  .mini.on { color: var(--text); border-color: var(--accent); }
  .chartbar .lbl { font-size: 12px; color: var(--muted); align-self: center; margin-left: 10px; }
  .chartbar .lbl:first-child { margin-left: 0; }
  .nochart { padding: 40px 16px; text-align: center; color: var(--muted); }

  .tablewrap { overflow-x: auto; margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--panel2); } tbody tr.on { background: #1f2a3a; }
  td.t1 { color: var(--t1); } td.t2 { color: var(--t2); } td.s1 { color: var(--s1); } td.s2 { color: var(--s2); } td.fh { color: var(--fh); }

  .status { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
  .status.done::before { animation: none; background: var(--muted); }
  @keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
  .error { color: #ff7b72; margin-top: 10px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); padding: 12px; border-radius: 8px; max-height: 420px; overflow: auto; }
  .confirm { margin-top: 12px; padding: 12px; border: 1px solid var(--hold); border-radius: 10px; background: #1f1a0e; }
  .confirm pre { max-height: 160px; }
  .confirm button { padding: 6px 16px; margin-right: 8px; }
  .allow { background: var(--buy); color: #fff; } .deny { background: var(--sell); color: #fff; }
  footer a { color: var(--muted); }
  .optform { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0; }
  .optform input[type=text] { flex: 1 1 280px; padding: 12px 14px; font-size: 17px; text-transform: uppercase; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
  .optform label { font-size: 13px; color: var(--muted); }
  .optform input[type=number] { width: 64px; padding: 6px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
  .optform .primary { padding: 12px 20px; }
  .ostatus { font-size: 13px; color: var(--muted); }
  .ounder { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .ounder .hcard { min-width: 180px; }
  .otable td, .otable th { font-size: 12.5px; padding: 6px 6px; }
  .otable th { white-space: normal; vertical-align: bottom; line-height: 1.25; min-width: 48px; }
  #optionsView .tablewrap { overflow-x: auto; }
  body.wide main { max-width: 1440px; }
  .otable tr.sel td { background: #1f2a3a; }
  .otable .rank { font-weight: 700; color: var(--muted); }
  .ret { font-weight: 700; }
  .bars { display: grid; grid-template-columns: 110px 1fr 40px; gap: 4px 8px; align-items: center; font-size: 12px; max-width: 460px; }
  .bars .b { display: block; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; } .bars .b i { display: block; height: 100%; background: var(--accent); }
  .odetail td { background: #11161d !important; white-space: normal !important; text-align: left !important; }
  .nav { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .navbtn { padding: 6px 16px; background: var(--panel); color: var(--muted); border: 1px solid var(--border); font-size: 14px; }
  .navbtn.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  .hfilters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 14px 0; font-size: 13px; color: var(--muted); }
  .hfilters select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; margin-left: 4px; }
  .hstatus { font-size: 13px; color: var(--muted); }
  .hnote:empty, .hdetail:empty { display: none; }
  .hnote { margin: 10px 0; }
  .hcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 10px 0 16px; }
  .hcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .hcard .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
  .hcard .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hcard .d { font-size: 12px; color: var(--muted); }
  .hgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .hbox { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; overflow-x: auto; }
  .hbox h3, .hsec { margin: 4px 0 8px; font-size: 14px; font-weight: 600; }
  .hsec { margin-top: 18px; }
  .ob { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .ob.win { background: #1f6f35; color: #fff; } .ob.stop { background: #8e2328; color: #fff; }
  .ob.expired { background: #30363d; color: var(--text); } .ob.open { background: #1f3a5f; color: #cde; } .ob.unknown, .ob.na { background: #30363d; color: var(--muted); }
  .pos { color: #3fb950; } .neg { color: #f85149; }
  .hdetail { background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; padding: 14px 16px; margin: 0 0 16px; }
  .hdetail .dchart { height: 420px; margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .hdetail .close { float: right; }
  .hhow { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
  @media (max-width: 600px) { .chart { height: 380px; } .card { padding: 14px; } }
</style>
</head>
<body>
<header>
  <h1>Stocky<span>power</span></h1>
  <p>Enter a symbol. Stocky calculates signals, targets, stops and forecasts on six timeframes.</p>
</header>

<nav class="nav">
  <button class="navbtn on" data-view="analyze">Analyze</button>
  <button class="navbtn" data-view="history">History &amp; accuracy</button>
  <button class="navbtn" data-view="options">Best Option Chains</button>
</nav>

<main>
  <section id="historyView" hidden>
    <div class="hfilters">
      <label>Symbol <select id="hSymbol"><option value="">All</option></select></label>
      <label>Timeframe <select id="hTf"><option value="">All</option></select></label>
      <label>Outcome <select id="hOutcome">
        <option value="">All</option><option value="win">Won (Target 1 or 2)</option><option value="target2">Reached Target 2</option>
        <option value="stop">Stopped out</option><option value="expired">Expired</option><option value="open">Still open</option>
      </select></label>
      <button class="mini" id="hRefresh">Refresh</button>
    </div>
    <div class="hstatus">Loading…</div>
    <div class="hnote"></div>
    <div class="hcards"></div>
    <div class="hdetail"></div>
    <div class="hgrid"></div>
    <h3 class="hsec">All calls <span class="hcount"></span></h3>
    <div class="tablewrap hcalls"></div>
    <p class="hhow"></p>
  </section>

  <section id="optionsView" hidden>
    <form id="optForm" class="optform" autocomplete="off">
      <input id="optSymbols" type="text" placeholder="NVDA  (or several: NVDA, AAPL, SPY)" />
      <label>Expiring more than <input id="optDays" type="number" min="1" max="2000" value="60" /> days out</label>
      <label>and at most <input id="optMaxDays" type="number" min="1" max="2000" placeholder="any" /> days (optional)</label>
      <label title="Out-of-the-money contracts are only considered if the stock has at least this chance of reaching the strike before expiry">Out of the money: at least <input id="optTouch" type="number" min="0" max="100" value="70" />% chance to reach the strike</label>
      <label>Strikes <select id="optPref">
        <option value="balanced">Balanced</option>
        <option value="otm">At / out of the money (cheaper, more leverage)</option>
        <option value="itm">In the money (pricier, higher odds)</option>
      </select></label>
      <label title="When Stocky's analysis of a symbol is missing or older than the latest trading day, start a Stocky run in the background. Each run is a Stocky session (uses Anthropic credits); at most one per symbol per trading day.">
        <input id="optAutoStocky" type="checkbox" checked /> Run Stocky automatically</label>
      <label>Minimum open interest <input id="optOI" type="number" min="0" max="100000" value="500" style="width:80px" /></label>
      <label title="How 'most profitable' is judged">Profit horizon <select id="optHorizon">
        <option value="30d">Next 30 days (typical move)</option>
        <option value="short">Next 5 sessions (Stocky's forecast)</option>
      </select></label>
      <label title="Next 5 sessions only: which of Stocky's forecasts to trade. 4-hour covers the 5 sessions; 1-hour is the most recent but covers ~1.5 sessions (then held flat with normal volatility).">5-session forecast <select id="optSource">
        <option value="4h">4-hour (covers 5 sessions)</option>
        <option value="1h">1-hour (most recent)</option>
      </select></label>
      <button class="primary" type="submit">Find best options</button>
    </form>
    <div class="hstatus ohorizon-note"></div>
    <div class="ostatus"></div>
    <div class="ounder"></div>
    <div class="ocheck"></div>
    <div class="oresults"></div>
    <p class="hhow ohow"></p>
  </section>

  <div id="analyzeView">
  <form id="form" autocomplete="off">
    <input id="symbol" type="text" placeholder="AAPL" maxlength="10" required autofocus />
    <button class="primary" type="submit">Ask Stocky</button>
  </form>
  <div class="history" id="history"></div>
  <div id="results"></div>
  </div>
</main>

<footer>Calculations by the Stocky agent · prices from Massive · charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a>. Not financial advice.</footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v) => (v === null || v === undefined || !Number.isFinite(+v) ? "—" : Math.abs(v) >= 1000 ? (+v).toFixed(2) : Math.abs(v) >= 1 ? (+v).toFixed(2) : (+v).toFixed(4));
const pct = (v, base) => (v == null || !base ? "" : `${v >= base ? "+" : ""}${(((v - base) / base) * 100).toFixed(2)}%`);
const HISTORY_KEY = "stockypower.history";
const SHORT_NEXT = { "15m": "next 15m", "1h": "next hour", "4h": "next 4h", "1D": "next day", "1W": "next week", "1M": "next month" };
const IND_COLORS = ["#d29922", "#a371f7", "#f778ba", "#79c0ff", "#ffa657", "#3fb950"];
const DEFAULT_TFS = [
  { key: "15m", label: "15 min", next: "next 15 minutes" }, { key: "1h", label: "1 hour", next: "next hour" },
  { key: "4h", label: "4 hours", next: "next 4 hours" }, { key: "1D", label: "1 day", next: "next trading day" },
  { key: "1W", label: "1 week", next: "next week" }, { key: "1M", label: "1 month", next: "next month" },
];

// Bars come in UTC; show them in New York (market) time.
const etFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function toET(sec) {
  const p = Object.fromEntries(etFmt.formatToParts(new Date(sec * 1000)).map((x) => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) / 1000;
}

// ── History chips ──────────────────────────────────────────────────────────
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }
function saveHistory(entry) {
  try {
    const h = loadHistory().filter((e) => e.symbol !== entry.symbol);
    h.unshift(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 30)));
  } catch {}
  renderHistory();
}
function renderHistory() {
  $("#history").innerHTML = loadHistory().map((e) =>
    `<button class="chip" data-sym="${esc(e.symbol)}" title="${esc(new Date(e.at).toLocaleString())}">${esc(e.symbol)} <b class="${esc(e.signal)}" style="background:none">${esc(e.signal || "")}</b></button>`
  ).join("");
}
$("#history").addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (chip) { $("#symbol").value = chip.dataset.sym; $("#form").requestSubmit(); }
});

// ── Result card ────────────────────────────────────────────────────────────
function newCard(symbol) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <div class="sym">${esc(symbol)}</div>
      <div class="badge pending">Analyzing…</div>
      <div class="meta"></div>
    </div>
    <div class="summary"></div>
    <div class="tabs"></div>
    <div class="levels"></div>
    <div class="checksbox"></div>
    <div class="track"></div>
    <div class="rationale"></div>
    <div class="livebar"></div>
    <div class="alerts"></div>
    <div class="chartbar"></div>
    <div class="chartwrap"><div class="legend"></div><div class="chart"><div class="nochart">Loading candles…</div></div></div>
    <div class="keys"></div>
    <div class="tablewrap"></div>
    <div class="confirms"></div>
    <div class="status">Connecting…</div>
    <details><summary>Stocky's full analysis</summary><pre class="raw"></pre></details>`;
  $("#results").prepend(card);
  const state = { symbol, card, tfs: DEFAULT_TFS, tf: "1D", candles: {}, analysis: null, checks: {}, record: {}, chart: null };
  card._state = state;
  renderTabs(state);
  return state;
}

function renderTabs(st) {
  const tfs = st.analysis?.timeframes || {};
  $(".tabs", st.card).innerHTML = st.tfs.map((t) =>
    `<button class="tab ${t.key === st.tf ? "on" : ""}" data-tf="${t.key}">${esc(t.label)}<span class="dot ${esc(tfs[t.key]?.signal || "")}"></span></button>`
  ).join("");
  $(".tabs", st.card).onclick = (ev) => {
    const b = ev.target.closest(".tab");
    if (b) selectTf(st, b.dataset.tf);
  };
}

function selectTf(st, tf) {
  st.tf = tf;
  st.alertState = null; // alerts compare within one timeframe
  if (st.candles?.[tf]) checkAlerts(st); // remember where things stand now, so the next update can compare
  renderTabs(st);
  renderLevels(st);
  drawChart(st);
  renderTable(st);
}

function lvBox(cls, label, v, base, sub) {
  return `<div class="lv ${cls}"><div class="k">${esc(label)}</div><div class="v">${fmt(v)}</div><div class="d">${esc(sub ?? pct(v, base))}</div></div>`;
}

function renderLevels(st) {
  const a = st.analysis?.timeframes?.[st.tf];
  const chk = st.checks?.[st.tf];
  const bars = st.candles[st.tf];
  const last = bars?.length ? bars[bars.length - 1].c : chk?.lastClose ?? null; // live price when available
  const tfInfo = st.tfs.find((t) => t.key === st.tf) || {};
  if (!a) {
    $(".levels", st.card).innerHTML = st.analysis
      ? `<div class="lv"><div class="k">${esc(tfInfo.label)}</div><div class="v">No levels</div><div class="d">Stocky didn't return this timeframe</div></div>`
      : last != null ? lvBox("", "Last price", last, null, st.failed ? "" : "Waiting for Stocky…") : "";
    $(".checksbox", st.card).innerHTML = "";
    $(".rationale", st.card).textContent = "";
    $(".track", st.card).textContent = "";
    return;
  }
  const nx = SHORT_NEXT[st.tf] || "next bar";
  $(".levels", st.card).innerHTML = [
    `<div class="lv"><div class="k">${esc(tfInfo.label)} signal</div><div class="v"><span class="badge sm ${esc(a.signal || "")}">${esc(a.signal || "—")}</span></div><div class="d">${a.confidence != null ? `Confidence ${a.confidence}%` : ""}</div></div>`,
    lvBox("", "Last price", last, null, chk?.atr ? `ATR ${fmt(chk.atr)}` : ""),
    lvBox("t1", "Target 1", a.target1, last),
    lvBox("t2", "Target 2", a.target2, last),
    lvBox("s1", "Stop loss 1", a.stop1, last),
    lvBox("s2", "Stop loss 2", a.stop2, last),
    lvBox("fh", "Forecast high", a.forecast_high, last, `${pct(a.forecast_high, last)} · ${nx}`),
    lvBox("fl", "Forecast low", a.forecast_low, last, `${pct(a.forecast_low, last)} · ${nx}`),
    lvBox("", "Reward : risk", null, null, "T1 vs Stop 1"),
  ].join("");
  // reward/risk box shows a ratio, not a price
  const rrBox = $(".levels", st.card).lastElementChild;
  $(".v", rrBox).textContent = chk?.rr != null ? `${chk.rr.toFixed(2)} : 1` : "—";
  $(".levels .fh .k", st.card).title = `Forecast high for the ${tfInfo.next || "next bar"}`;
  $(".levels .fl .k", st.card).title = `Forecast low for the ${tfInfo.next || "next bar"}`;

  if (chk) {
    $(".checksbox", st.card).innerHTML = chk.ok
      ? `<div class="checks ok">✓ All accuracy checks passed: levels are in the right order, on the correct side of the price, a sensible distance for this timeframe, and based on Massive's latest close.</div>`
      : `<div class="checks bad">⚠ Treat these levels with caution. Checks found:<ul>${chk.issues.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
  }
  $(".rationale", st.card).textContent = a.rationale || "";
  const r = st.record?.[st.tf];
  $(".track", st.card).innerHTML = r && r.calls
    ? `Track record for ${esc(st.symbol)} on ${esc(tfInfo.label)} (earlier calls): ${r.calls} calls · ` +
      (r.decided ? `won ${r.wins} of ${r.decided} decided (${Math.round(r.winRate * 100)}%) · ` : "") +
      `Target 2 ${r.target2} · stopped ${r.stop} · expired ${r.expired} · open ${r.open}` +
      (r.fhChecked ? ` · forecast high held ${Math.round(r.fhHeldRate * 100)}%` : "") +
      ` · <a href="#" class="tohist" data-sym="${esc(st.symbol)}" data-tf="${esc(st.tf)}">see all in History</a>`
    : `Track record: no earlier calls for ${esc(st.symbol)} on ${esc(tfInfo.label)} yet. Each run is saved, and later runs show how they turned out.`;
}

function renderTable(st) {
  const tfs = st.analysis?.timeframes;
  if (!tfs) { $(".tablewrap", st.card).innerHTML = ""; return; }
  const rows = st.tfs.map((t) => {
    const a = tfs[t.key];
    const chk = st.checks?.[t.key];
    if (!a) return `<tr data-tf="${t.key}" class="${t.key === st.tf ? "on" : ""}"><td>${esc(t.label)}</td><td colspan="8" style="text-align:left;color:var(--muted)">No data</td></tr>`;
    return `<tr data-tf="${t.key}" class="${t.key === st.tf ? "on" : ""}">
      <td>${esc(t.label)}</td><td><span class="badge sm ${esc(a.signal || "")}">${esc(a.signal || "—")}</span></td>
      <td>${fmt(chk?.lastClose ?? a.price)}</td><td class="t1">${fmt(a.target1)}</td><td class="t2">${fmt(a.target2)}</td>
      <td class="s1">${fmt(a.stop1)}</td><td class="s2">${fmt(a.stop2)}</td><td class="fh">${fmt(a.forecast_high)}</td>
      <td>${chk ? (chk.ok ? "✓" : `⚠ ${chk.issues.length}`) : ""}</td></tr>`;
  }).join("");
  $(".tablewrap", st.card).innerHTML = `<table><thead><tr><th>Timeframe</th><th>Signal</th><th>Price</th><th>Target 1</th><th>Target 2</th><th>Stop 1</th><th>Stop 2</th><th>Forecast high (next bar)</th><th>Checks</th></tr></thead><tbody>${rows}</tbody></table>`;
  $(".tablewrap tbody", st.card).onclick = (ev) => {
    const tr = ev.target.closest("tr");
    if (tr) selectTf(st, tr.dataset.tf);
  };
}

// ── Chart ──────────────────────────────────────────────────────────────────

// Lightweight Charts needs strictly increasing times. Converting to New York time
// can repeat an hour when clocks fall back, so drop repeats and bad values here.
function cleanPoints(points) {
  const out = [];
  for (const p of points.slice().sort((x, y) => x.time - y.time)) {
    const vals = "value" in p ? [p.value] : [p.open, p.high, p.low, p.close];
    if (!Number.isFinite(p.time) || vals.some((v) => !Number.isFinite(v))) continue;
    if (out.length && p.time <= out[out.length - 1].time) continue;
    out.push(p);
  }
  return out;
}

function drawChart(st) {
  const el = $(".chart", st.card);
  const legend = $(".legend", st.card);
  if (st.chart) { st.chart.remove(); st.chart = null; }
  el.innerHTML = "";
  legend.innerHTML = "";
  const bars = st.candles[st.tf] || [];
  const a = st.analysis?.timeframes?.[st.tf];
  const LW = window.LightweightCharts;
  if (!LW) { el.innerHTML = `<div class="nochart">The chart library didn't load.</div>`; return; }
  if (!bars.length) {
    el.innerHTML = `<div class="nochart">${st.candlesLoaded ? "No Massive candles for this timeframe." : "Loading candles…"}</div>`;
    $(".keys", st.card).innerHTML = "";
    return;
  }
  try {
    renderChart(st, el, legend, bars, a, LW);
  } catch (err) {
    console.error(err);
    if (st.chart) { st.chart.remove(); st.chart = null; }
    el.innerHTML = `<div class="nochart">This timeframe's chart data couldn't be drawn (${esc(err.message)}).</div>`;
  }
}

// Colours from the user's TradingView layout: Heikin-Ashi bars green/red,
// Smoothed HA (12, Exponential) candles yellow/purple.
const HA_UP = "#2ee65a", HA_DN = "#f23645";
const SHA_UP = "#e6d84c", SHA_DN = "#6c4cb8"; // from the indicator's Inputs tab

// Ultra RSI [DW] Style tab: threshold/midline colours, 5 RSI line colours, fill colours.
const DW = {
  ob: "#1fae1f", mid: "#c86a00", os: "#b30000",
  line: ["#00ff00", "#008000", "#ff0000", "#800000", "#ff8000"], // above&rising, above&falling, below&falling, below&rising, at midline
  fill: ["rgba(16,160,16,0.55)", "rgba(10,80,10,0.75)", "rgba(190,16,16,0.55)", "rgba(95,10,10,0.75)", "rgba(255,128,0,0.4)"],
};
// Which of the five DW states a value is in.
function dwState(v, prev, mid = 50) {
  if (v > mid) return prev == null || v >= prev ? 0 : 1;
  if (v < mid) return prev == null || v <= prev ? 2 : 3;
  return 4;
}

const PREFS_KEY = "stockypower.chart";
function loadChartPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; } }
function saveChartPrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {} }

// Turns Stocky's indicators into drawing instructions. Also recognises the
// older format (plain lines) so Heikin-Ashi and RSI still draw properly.
function planIndicators(a, bars, calc) {
  let inds = (a?.indicators || []).map((x) => ({ ...x, levels: [...(x.levels || [])], series: x.series || [], candles: x.candles || [], band: x.band || [] }));

  // Smoothed HA and Ultra RSI are calculated by the app (same values Stocky used);
  // Stocky contributes the readings.
  if (calc) {
    const isHA = (i) => /heikin|heiken|smoothed\s*ha|\bha\b/i.test(i.name);
    const isRSI = (i) => /rsi/i.test(i.name);
    const haR = inds.find(isHA), rsiR = inds.find(isRSI);
    inds = inds.filter((i) => !isHA(i) && !isRSI(i));
    if (calc.ha?.length)
      inds.unshift({ name: "Smoothed HA", pane: "price", style: "candles", candles: calc.ha, series: [], band: [], levels: [], reading: haR?.reading || "", colors: haR?.colors || {}, settings: { "EMA": 12, "then EMA": 3 } });
    if (calc.ursi?.length)
      inds.push({ name: "Ultra RSI [DW]", dw: true, pane: "separate", style: "baseline", base: 50, levels: [75, 25], group: "ultra rsi", series: calc.ursi, candles: [], band: [], reading: rsiR?.reading || "", colors: rsiR?.colors || {}, settings: { source: "close", period: 12, filter: "EMA", type: "Standard", volume: "Default" } });
  }

  // Heikin-Ashi sent as separate "Open" and "Close" lines -> HA candles.
  let ha = inds.find((i) => i.style === "candles" && i.candles.length);
  if (!ha) {
    const isHA = (i) => /heikin|heiken/i.test(i.name) && i.series.length;
    const op = inds.find((i) => isHA(i) && /open/i.test(i.name));
    const cl = inds.find((i) => isHA(i) && /close/i.test(i.name));
    if (op && cl) {
      const opens = new Map(op.series.map((p) => [p.t, p.v]));
      const real = new Map(bars.map((b) => [b.t, b]));
      const candles = cl.series.filter((p) => opens.has(p.t)).map((p) => {
        const o = opens.get(p.t), c = p.v, b = real.get(p.t);
        return { t: p.t, o, c, h: Math.max(o, c, b ? b.h : -Infinity), l: Math.min(o, c, b ? b.l : Infinity) };
      });
      ha = { name: "Smoothed Heikin-Ashi", pane: "price", style: "candles", candles, reading: cl.reading || op.reading, levels: [], series: [], band: [] };
      inds.splice(inds.indexOf(op), 1);
      inds.splice(inds.indexOf(cl), 1);
      inds.unshift(ha);
    }
  }

  for (const i of inds) {
    // RSI-type oscillators without a style -> filled around their centre line.
    if (i.pane === "separate" && i.style === "line" && /rsi/i.test(i.name) && !/signal|%d|smooth/i.test(i.name) && i.series.length) {
      const vals = i.series.map((p) => p.v);
      const lo = Math.min(...vals), hi = Math.max(...vals);
      if (lo >= -1 && hi <= 101) {
        i.style = "baseline";
        if (i.base == null) i.base = 50;
        // Ultra RSI [DW] is configured with 75 / 25 in the user's TradingView layout.
        if (!i.levels.length) i.levels = /ultra/i.test(i.name) ? [75, 25] : [70, 30];
      } else if (lo < 0 && hi > 0) {
        i.style = "baseline";
        if (i.base == null) i.base = 0;
      }
    }
    // Panel grouping: "X signal", "X %D", "X histogram" share X's panel.
    if (!i.group) {
      const m = i.name.match(/^(.*?)\s*[-–:]?\s*(signal(\s*line)?|%d|%k|line|fast|slow|histogram|hist)$/i);
      i.group = (m && m[1] ? m[1] : i.name).trim().toLowerCase();
    }
  }

  const overlays = inds.filter((i) => i.pane === "price" && i !== ha && (i.series.length || i.band.length));
  const groups = [];
  for (const i of inds.filter((x) => x.pane === "separate" && (x.series.length || x.band.length))) {
    let g = groups.find((x) => x.key === i.group);
    if (!g) groups.push((g = { key: i.group, items: [] }));
    g.items.push(i);
  }
  return { ha: ha && ha.candles.length ? ha : null, overlays, panels: groups.slice(0, 3) };
}

// Smoothed-HA colours: strong up, fading up, fading down, strong down. Stocky's
// configured colours win; these defaults are used only if it doesn't send any.
function haColor(cur, prev, colors = {}) {
  const up = cur.c >= cur.o;
  const body = Math.abs(cur.c - cur.o);
  const prevBody = prev ? Math.abs(prev.c - prev.o) : 0;
  const bull = colors.bull || colors.up || colors.bullish || "#2fbf71";
  const bear = colors.bear || colors.down || colors.bearish || "#e5534b";
  const bullWeak = colors.bullweak || colors.upweak || (colors.bull || colors.up ? bull : "#d4b72c");
  const bearWeak = colors.bearweak || colors.downweak || (colors.bear || colors.down ? bear : "#9d6ff0");
  if (up) return body >= prevBody ? bull : bullWeak;
  return body >= prevBody ? bear : bearWeak;
}

// "#rrggbb" + alpha -> "rgba(...)".
function rgba(hex, alpha) {
  let h = String(hex || "").replace("#", "");
  if (h.length === 3) h = [...h].map((c) => c + c).join("");
  const n = parseInt(h.slice(0, 6), 16);
  if (!Number.isFinite(n)) return `rgba(139,148,158,${alpha})`;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

// "length 14 · method RMA · levels 80 / 20" from what Stocky reported.
function settingsText(ind) {
  const parts = Object.entries(ind.settings || {}).map(([k, v]) => `${k.replace(/_/g, " ")} ${v}`);
  if (ind.levels?.length) parts.push(`levels ${ind.levels.join(" / ")}`);
  if (ind.base != null && ind.style === "baseline") parts.push(`centre ${ind.base}`);
  return parts.join(" · ");
}

function renderChart(st, el, legend, bars, a, LW) {
  const intraday = ["15m", "1h", "4h"].includes(st.tf);
  const plan = planIndicators(a, bars, st.calc?.[st.tf]);
  // Display choices (remembered): bars = Heikin-Ashi | regular; Smoothed HA indicator on/off.
  const prefs = loadChartPrefs();
  const barsMode = prefs.bars === "regular" ? "regular" : "ha";
  const showSha = Boolean(plan.ha) && prefs.sha !== false;
  const useHA = barsMode === "ha";
  el.style.height = `${430 + plan.panels.length * 130}px`;

  const bar = $(".chartbar", st.card);
  bar.innerHTML =
    `<span class="lbl">Bars</span>` +
    [["ha", "Heikin-Ashi"], ["regular", "Regular"]]
      .map(([m, label]) => `<button class="mini ${barsMode === m ? "on" : ""}" data-bars="${m}">${label}</button>`)
      .join("") +
    (plan.ha ? `<span class="lbl">Smoothed HA (12, Exponential)</span><button class="mini ${showSha ? "on" : ""}" data-sha="1">${showSha ? "On" : "Off"}</button>` : "");
  bar.onclick = (ev) => {
    const b = ev.target.closest(".mini");
    if (!b) return;
    const p = loadChartPrefs();
    if (b.dataset.bars) p.bars = b.dataset.bars;
    if (b.dataset.sha) p.sha = !(p.sha !== false);
    saveChartPrefs(p);
    // Redraw every open card so they all follow the same choice.
    document.querySelectorAll(".card").forEach((c) => c._state && drawChart(c._state));
  };

  const chart = LW.createChart(el, {
    autoSize: true,
    layout: {
      background: { type: "solid", color: "#0d1117" },
      textColor: "#8b949e",
      fontSize: 11,
      fontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif',
      attributionLogo: false, // credited with a link in the page footer instead
      panes: { separatorColor: "#30363d", separatorHoverColor: "rgba(56,139,253,0.25)", enableResize: false },
    },
    grid: { vertLines: { visible: false }, horzLines: { color: "#161b22" } },
    rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.1, bottom: 0.22 } },
    timeScale: { borderVisible: false, timeVisible: intraday, secondsVisible: false, rightOffset: 6, fixLeftEdge: true },
    crosshair: {
      mode: LW.CrosshairMode.Normal,
      vertLine: { color: "#484f58", style: LW.LineStyle.Dashed, labelBackgroundColor: "#30363d" },
      horzLine: { color: "#484f58", style: LW.LineStyle.Dashed, labelBackgroundColor: "#30363d" },
    },
  });
  st.chart = chart;
  const lastClose = bars[bars.length - 1].c;
  const pricePrecision = lastClose < 1 ? { type: "price", precision: 4, minMove: 0.0001 } : { type: "price", precision: 2, minMove: 0.01 };
  const two = { type: "price", precision: 2, minMove: 0.01 };
  const quiet = { priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };

  // ── Price pane ──
  const real = cleanPoints(bars.map((b) => ({ time: toET(b.t), open: b.o, high: b.h, low: b.l, close: b.c, _v: b.v })));
  let mainData;
  if (useHA) {
    // Standard (unsmoothed) Heikin-Ashi candles from the real bars.
    const pts = [];
    for (let i = 0; i < real.length; i++) {
      const r = real[i];
      const close = (r.open + r.high + r.low + r.close) / 4;
      const open = i === 0 ? (r.open + r.close) / 2 : (pts[i - 1].open + pts[i - 1].close) / 2;
      pts.push({ time: r.time, open, close, high: Math.max(r.high, open, close), low: Math.min(r.low, open, close) });
    }
    mainData = pts.map((p) => {
      const color = p.close >= p.open ? HA_UP : HA_DN;
      return { ...p, color, wickColor: color, borderColor: color };
    });
  } else {
    mainData = real.map(({ _v, ...p }) => p);
  }
  const main = chart.addSeries(LW.CandlestickSeries, {
    upColor: "#26a641", downColor: "#e5534b", borderVisible: false, wickUpColor: "#26a641", wickDownColor: "#e5534b",
    priceLineColor: "#8b949e", priceLineStyle: LW.LineStyle.Dotted, priceFormat: pricePrecision,
    // With HA candles the series' own last value is the HA close, not the real price.
    lastValueVisible: !useHA, priceLineVisible: !useHA,
  });
  main.setData(mainData);
  if (useHA && real.length) {
    main.createPriceLine({ price: real[real.length - 1].close, color: "#8b949e", lineWidth: 1, lineStyle: LW.LineStyle.Dotted, axisLabelVisible: true, title: "Last" });
  }

  // Volume along the bottom of the price pane.
  if (real.some((p) => p._v > 0)) {
    const vol = chart.addSeries(LW.HistogramSeries, { ...quiet, priceScaleId: "vol", priceFormat: { type: "volume" } });
    vol.priceScale().applyOptions({ scaleMargins: { top: 0.84, bottom: 0 } });
    const t0 = mainData.length ? mainData[0].time : -Infinity; // keep volume to the candles' range
    vol.setData(real.filter((p) => p.time >= t0).map((p) => ({ time: p.time, value: p._v, color: p.close >= p.open ? "rgba(38,166,154,0.35)" : "rgba(239,83,80,0.35)" })));
  }

  const keys = [];
  const legendSeries = [];
  if (useHA) keys.push(`<span><i style="background:linear-gradient(90deg,${HA_UP} 50%,${HA_DN} 50%)"></i>Heikin-Ashi candles</span>`);

  // The Smoothed HA (12, Exponential) indicator: its own candles drawn over the chart's
  // candles, as the indicator does in TradingView.
  let shaSeries = null, shaData = [];
  if (showSha) {
    const pts = cleanPoints(plan.ha.candles.map((p) => ({ time: toET(p.t), open: p.o, high: p.h, low: p.l, close: p.c })));
    const hc = plan.ha.colors || {};
    const up = hc.bull || hc.up || SHA_UP, dn = hc.bear || hc.down || SHA_DN;
    shaData = pts.map((p) => {
      const color = p.close >= p.open ? up : dn;
      return { ...p, color, wickColor: color, borderColor: color };
    });
    shaSeries = chart.addSeries(LW.CandlestickSeries, { ...quiet, borderVisible: false, priceFormat: pricePrecision });
    shaSeries.setData(shaData);
    keys.push(`<span><i style="background:linear-gradient(90deg,${up} 50%,${dn} 50%)"></i>Smoothed HA (12, Exponential)${plan.ha.reading ? ` · ${esc(plan.ha.reading)}` : ""}</span>`);
  }

  let colorIdx = 0;
  const nextColor = (c) => c || IND_COLORS[colorIdx++ % IND_COLORS.length];
  for (const ind of plan.overlays) {
    const color = nextColor(ind.color || ind.colors?.line);
    if (ind.style === "band" && ind.band.length) {
      for (const k of ["upper", "lower"]) {
        chart.addSeries(LW.LineSeries, { ...quiet, color: color + "99", lineWidth: 1 }).setData(cleanPoints(ind.band.map((p) => ({ time: toET(p.t), value: p[k] }))));
      }
      if (ind.band.some((p) => p.mid != null))
        chart.addSeries(LW.LineSeries, { ...quiet, color: color + "66", lineWidth: 1, lineStyle: LW.LineStyle.Dashed }).setData(cleanPoints(ind.band.filter((p) => p.mid != null).map((p) => ({ time: toET(p.t), value: p.mid }))));
    } else {
      const s = chart.addSeries(LW.LineSeries, { ...quiet, color, lineWidth: 2 });
      s.setData(cleanPoints(ind.series.map((p) => ({ time: toET(p.t), value: p.v }))));
      legendSeries.push([ind.name, s, color]);
    }
    const set = settingsText(ind);
    keys.push(`<span><i style="background:${color}"></i>${esc(ind.name)}${set ? ` (${esc(set)})` : ""}${ind.reading ? ` · ${esc(ind.reading)}` : ""}</span>`);
  }

  // Forecast continues from the last real close.
  const fc = a?.forecast || [];
  const anchor = real[real.length - 1];
  if (fc.length && anchor) {
    const color = a.signal === "SELL" ? "#f85149" : a.signal === "BUY" ? "#3fb950" : "#d29922";
    const mk = (key) =>
      cleanPoints([{ time: anchor.time, value: anchor.close }, ...fc.filter((p) => p[key] != null).map((p) => ({ time: toET(p.t), value: p[key] }))]).filter((p) => p.time >= anchor.time);
    // Range: clearly visible dashed bounds, with their end values tagged on the price axis.
    for (const key of ["high", "low"]) {
      const d = mk(key);
      if (d.length > 1)
        chart.addSeries(LW.LineSeries, {
          ...quiet, color: rgba(color, 0.85), lineWidth: 2, lineStyle: LW.LineStyle.Dashed,
          lastValueVisible: true, title: key === "high" ? "Fcst hi" : "Fcst lo",
        }).setData(d);
    }
    const path = mk("price");
    if (path.length > 1) {
      chart.addSeries(LW.LineSeries, { ...quiet, color, lineWidth: 3, lineStyle: LW.LineStyle.Solid, lastValueVisible: true, title: "Fcst" }).setData(path);
      // Dot at each forecast bar so the path reads clearly.
      chart.addSeries(LW.LineSeries, { ...quiet, lineVisible: false, pointMarkersVisible: true, pointMarkersRadius: 2.5, color }).setData(path.slice(1));
    }
    keys.push(`<span><i style="background:${color}"></i>Forecast path (solid) · range (dashed)</span>`);
  }

  // Targets and stops (dashed, labelled), forecast high/low (dotted, no tag).
  if (a) {
    const levels = [
      ["TP2", a.target2, "#56d364", LW.LineStyle.Dashed, true], ["TP1", a.target1, "#3fb950", LW.LineStyle.Dashed, true],
      ["", a.forecast_high, "#58a6ff", LW.LineStyle.Dotted, false], ["", a.forecast_low, "#a371f7", LW.LineStyle.Dotted, false],
      ["SL1", a.stop1, "#f85149", LW.LineStyle.Dashed, true], ["SL2", a.stop2, "#ff7b72", LW.LineStyle.Dashed, true],
    ];
    for (const [title, price, color, lineStyle, tag] of levels) {
      if (Number.isFinite(price)) main.createPriceLine({ price, color, lineWidth: 1, lineStyle, axisLabelVisible: tag, title, lineVisible: true });
    }
    keys.push(`<span><i style="background:#3fb950"></i>TP1 / TP2 targets</span><span><i style="background:#f85149"></i>SL1 / SL2 stops</span><span><i style="background:#58a6ff"></i>Forecast high / low (${esc(SHORT_NEXT[st.tf] || "next bar")}, dotted)</span>`);
  }

  // Stocky's buy/sell signals as labelled markers.
  const sigs = a?.signals || [];
  if (sigs.length && LW.createSeriesMarkers) {
    const times = new Set(mainData.map((p) => p.time));
    const idxOf = new Map(mainData.map((p, i) => [p.time, i]));
    let lastKept = null;
    const markers = sigs
      .map((sg) => ({ ...sg, time: toET(sg.t) }))
      .filter((sg) => times.has(sg.time))
      // Merge repeats: same side within 3 bars of the previous label (keep the stronger/first).
      .filter((sg) => {
        const i = idxOf.get(sg.time);
        if (lastKept && lastKept.side === sg.side && i - lastKept.i <= 3) {
          if (sg.strong && !lastKept.sg.strong) lastKept.sg.strong = true;
          return false;
        }
        lastKept = { side: sg.side, i, sg };
        return true;
      })
      .map((sg) => ({
        time: sg.time,
        position: sg.side === "BUY" ? "belowBar" : "aboveBar",
        shape: sg.side === "BUY" ? "arrowUp" : "arrowDown",
        color: sg.side === "BUY" ? (sg.strong ? "#2ea043" : "#3fb950") : sg.strong ? "#da3633" : "#f85149",
        text: sg.label || `${sg.strong ? "Strong " : ""}${sg.side === "BUY" ? "Buy" : "Sell"}`,
        size: sg.strong ? 1.4 : 1,
      }));
    if (markers.length) {
      LW.createSeriesMarkers(main, markers);
      keys.push(`<span><i style="background:#3fb950"></i>Stocky's buy / sell signals</span>`);
    }
  }

  // Panel scales always include the centre line and threshold levels.
  const includeLevels = (extra) => (original) => {
    const r = original();
    if (!r || !extra.length) return r;
    return { ...r, priceRange: { minValue: Math.min(r.priceRange.minValue, ...extra), maxValue: Math.max(r.priceRange.maxValue, ...extra) } };
  };

  // ── Indicator panels ──
  plan.panels.forEach((g, gi) => {
    const paneIdx = gi + 1;
    let title = g.items[0].name;
    for (const ind of g.items) {
      const cc = ind.colors || {};
      const color = nextColor(ind.color || (ind !== g.items[0] ? cc.signal : null) || cc.line || cc.signal);
      const bull = cc.bull || cc.up || cc.above || cc.bullish || "#2ea043";
      const bear = cc.bear || cc.down || cc.below || cc.bearish || "#da3633";
      let s;
      if (ind.dw) {
        // Ultra RSI [DW] as TradingView draws it: per-bar shaded fill between the RSI and
        // the midline, a 5-colour RSI line, and green / orange / red threshold lines.
        const mid = ind.base ?? 50;
        const pts = cleanPoints(ind.series.map((p) => ({ time: toET(p.t), value: p.v })));
        const states = pts.map((p, i) => dwState(p.value, i ? pts[i - 1].value : null, mid));
        const fill = chart.addSeries(LW.HistogramSeries, { ...quiet, base: mid, priceFormat: two, autoscaleInfoProvider: includeLevels([mid, ...ind.levels]) }, paneIdx);
        fill.setData(pts.map((p, i) => ({ ...p, color: DW.fill[states[i]] })));
        s = chart.addSeries(LW.LineSeries, { ...quiet, lastValueVisible: true, lineWidth: 2, color: DW.line[0], priceFormat: two }, paneIdx);
        s.setData(pts.map((p, i) => ({ ...p, color: DW.line[states[i]] })));
        s.createPriceLine({ price: mid, color: DW.mid, lineWidth: 1, lineStyle: LW.LineStyle.Solid, axisLabelVisible: false, title: "" });
        const [ob, os] = [Math.max(...ind.levels), Math.min(...ind.levels)];
        if (Number.isFinite(ob)) s.createPriceLine({ price: ob, color: DW.ob, lineWidth: 1, lineStyle: LW.LineStyle.Solid, axisLabelVisible: true, title: "" });
        if (Number.isFinite(os)) s.createPriceLine({ price: os, color: DW.os, lineWidth: 1, lineStyle: LW.LineStyle.Solid, axisLabelVisible: true, title: "" });
        legendSeries.push([ind.name, s, "#c9d1d9"]);
        const set = settingsText(ind);
        keys.push(`<span><i style="background:linear-gradient(90deg,${DW.line.slice(0, 4).join(",")})"></i>${esc(ind.name)} (panel ${paneIdx}${set ? ` · ${esc(set)}` : ""})${ind.reading ? ` · ${esc(ind.reading)}` : ""}</span>`);
        continue;
      } else if (ind.style === "baseline") {
        const base = ind.base ?? 0;
        s = chart.addSeries(LW.BaselineSeries, {
          ...quiet, lastValueVisible: true, priceFormat: two, lineWidth: 1,
          baseValue: { type: "price", price: base },
          autoscaleInfoProvider: includeLevels([base, ...ind.levels]),
          topLineColor: bull, topFillColor1: rgba(bull, 0.55), topFillColor2: rgba(bull, 0.08),
          bottomLineColor: bear, bottomFillColor1: rgba(bear, 0.08), bottomFillColor2: rgba(bear, 0.55),
        }, paneIdx);
        s.setData(cleanPoints(ind.series.map((p) => ({ time: toET(p.t), value: p.v }))));
        s.createPriceLine({ price: base, color: "#6e7681", lineWidth: 1, lineStyle: LW.LineStyle.Solid, axisLabelVisible: false, title: "" });
      } else if (ind.style === "histogram") {
        const base = ind.base ?? 0;
        s = chart.addSeries(LW.HistogramSeries, { ...quiet, lastValueVisible: true, priceFormat: two, base }, paneIdx);
        s.setData(cleanPoints(ind.series.map((p) => ({ time: toET(p.t), value: p.v }))).map((p) => ({ ...p, color: rgba(p.value >= base ? bull : bear, 0.8) })));
      } else if (ind.style === "band" && ind.band.length) {
        for (const k of ["upper", "lower"]) {
          chart.addSeries(LW.LineSeries, { ...quiet, color: color + "99", lineWidth: 1, priceFormat: two }, paneIdx).setData(cleanPoints(ind.band.map((p) => ({ time: toET(p.t), value: p[k] }))));
        }
        keys.push(`<span><i style="background:${color}"></i>${esc(ind.name)}</span>`);
        continue;
      } else {
        s = chart.addSeries(LW.LineSeries, { ...quiet, lastValueVisible: true, color, lineWidth: g.items.length > 1 && ind !== g.items[0] ? 1 : 2, priceFormat: two, autoscaleInfoProvider: includeLevels(ind.levels) }, paneIdx);
        s.setData(cleanPoints(ind.series.map((p) => ({ time: toET(p.t), value: p.v }))));
      }
      for (const lv of ind.levels) {
        const above = ind.base != null ? lv > ind.base : lv >= 50;
        s.createPriceLine({ price: lv, color: above ? cc.overbought || bull : cc.oversold || bear, lineWidth: 1, lineStyle: LW.LineStyle.Solid, axisLabelVisible: true, title: "" });
      }
      const swatch = ind.style === "baseline" || ind.style === "histogram" ? `linear-gradient(90deg,${bull} 50%,${bear} 50%)` : color;
      legendSeries.push([ind.name, s, ind.style === "baseline" || ind.style === "histogram" ? "#c9d1d9" : color]);
      const set = settingsText(ind);
      keys.push(`<span><i style="background:${swatch}"></i>${esc(ind.name)} (panel ${paneIdx}${set ? ` · ${esc(set)}` : ""})${ind.reading ? ` · ${esc(ind.reading)}` : ""}</span>`);
      if (ind !== g.items[0]) title += ` · ${ind.name}`;
    }
    const pane = chart.panes()[paneIdx];
    if (pane && LW.createTextWatermark) {
      const reading = g.items[0].reading ? `  ·  ${g.items[0].reading}` : "";
      const set = settingsText(g.items[0]);
      LW.createTextWatermark(pane, {
        horzAlign: "left",
        vertAlign: "top",
        lines: [{ text: title + reading, color: "#8b949e", fontSize: 12 }, ...(set ? [{ text: set, color: "#6e7681", fontSize: 11 }] : [])],
      });
    }
  });
  const panes = chart.panes();
  panes[0].setStretchFactor(3);
  for (let i = 1; i < panes.length; i++) panes[i].setStretchFactor(1);

  $(".keys", st.card).innerHTML = keys.join("");

  // Header: always the latest bar; follows the crosshair on hover.
  const tfLabel = (st.tfs.find((t) => t.key === st.tf) || {}).label || st.tf;
  const realByTime = new Map(real.map((p) => [p.time, p]));
  const shaByTime = new Map(shaData.map((p) => [p.time, p]));
  const header = (c, prev, vals) => {
    if (!c) return "";
    const r = realByTime.get(c.time) || c;
    const rPrev = prev ? realByTime.get(prev.time) || prev : null;
    const ch = rPrev ? r.close - rPrev.close : null;
    const chs = ch == null ? "" : `<span class="${ch >= 0 ? "up" : "dn"}">${ch >= 0 ? "+" : ""}${ch.toFixed(2)} (${pct(r.close, rPrev.close)})</span>`;
    let h = `<span class="ttl">${esc(st.symbol)} · ${esc(tfLabel)}</span><span>O ${fmt(r.open)}</span><span>H ${fmt(r.high)}</span><span>L ${fmt(r.low)}</span><span>C ${fmt(r.close)}</span>${chs}`;
    if (useHA) h += `<span style="color:${c.color || "#8b949e"}">HA ${fmt(c.open)} → ${fmt(c.close)}</span>`;
    const sh = shaByTime.get(c.time);
    if (sh) h += `<span style="color:${sh.color}">Smoothed HA ${fmt(sh.open)} → ${fmt(sh.close)}</span>`;
    h += "<br>";
    for (const [name, , color, v] of vals) if (v != null) h += `<span style="color:${color}">${esc(name)} ${fmt(v)}</span>`;
    return h;
  };
  const latestVals = () => legendSeries.map(([n, s, c]) => { const d = s.data(); return [n, s, c, d.length ? d[d.length - 1].value : null]; });
  const showLatest = () => (legend.innerHTML = header(mainData[mainData.length - 1], mainData[mainData.length - 2], latestVals()));
  showLatest();
  chart.subscribeCrosshairMove((param) => {
    if (!param.time || !param.point) return showLatest();
    const c = param.seriesData.get(main);
    if (!c) return showLatest();
    const idx = mainData.findIndex((x) => x.time === param.time);
    const vals = legendSeries.map(([n, s, col]) => [n, s, col, param.seriesData.get(s)?.value ?? null]);
    legend.innerHTML = header({ ...c, color: mainData[idx]?.color }, idx > 0 ? mainData[idx - 1] : null, vals);
  });

  // Open on the last ~90 candles plus the forecast (by time, so other series can't shift it),
  // so the forecast gets a readable share of the width. Scroll or zoom for more history.
  if (mainData.length) {
    const from = mainData[Math.max(0, mainData.length - 90)].time;
    const fcTimes = fc.map((p) => toET(p.t)).filter(Number.isFinite);
    const to = Math.max(mainData[mainData.length - 1].time, ...fcTimes);
    chart.timeScale().setVisibleRange({ from, to });
  }
}

// ── Live updates & alerts ────────────────────────────────────────────────
// While a result is open, fetch the newest Massive bars every LIVE.seconds and redraw
// candles + indicators (calculated by the app; Stocky isn't called). Stocky's levels
// stay as they were. Alerts fire on level crosses and indicator flips.
const liveBySymbol = new Map();

function startLive(st) {
  if (!LIVE.seconds || st.live) return;
  const prev = liveBySymbol.get(st.symbol);
  if (prev && prev !== st) stopLive(prev, "Replaced by a newer result for this symbol.");
  liveBySymbol.set(st.symbol, st);
  st.live = { timer: setInterval(() => liveTick(st), LIVE.seconds * 1000), updated: Date.now(), error: null };
  renderLive(st);
}

function stopLive(st, why) {
  if (!st.live) return;
  clearInterval(st.live.timer);
  st.live = null;
  st.liveStopped = why || "Live updates stopped.";
  renderLive(st);
}

async function liveTick(st) {
  if (document.hidden || !st.live || st.liveBusy) return renderLive(st);
  if (!document.body.contains(st.card)) return stopLive(st);
  st.liveBusy = true;
  try {
    const r = await fetch(`/api/live?symbol=${encodeURIComponent(st.symbol)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    const range = st.chart?.timeScale().getVisibleLogicalRange();
    st.candles = d.candles || st.candles;
    st.calc = d.calc || st.calc;
    renderLevels(st);
    drawChart(st);
    // Keep your zoom/scroll, but only if that view still contains candles.
    const n = st.candles[st.tf]?.length || 0;
    if (range && st.chart && range.from < n - 1 && range.to > 0) st.chart.timeScale().setVisibleLogicalRange(range);
    st.live.updated = d.at || Date.now();
    st.live.error = null;
    checkAlerts(st);
  } catch (err) {
    if (st.live) st.live.error = err.message;
  } finally {
    st.liveBusy = false;
    renderLive(st);
  }
}

function renderLive(st) {
  const el = $(".livebar", st.card);
  if (!el) return;
  const t = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const delay = LIVE.delay ? `${LIVE.delay}-min delayed (Massive plan)` : "real-time";
  let text;
  if (st.live) {
    text = document.hidden
      ? `<span class="dot off"></span>Live · paused while this tab is hidden`
      : `<span class="dot"></span>Live · ${delay} · updates every ${LIVE.seconds}s · last ${t(st.live.updated)}`;
    if (st.live.error) text += ` · <span style="color:#ff7b72">update failed (${esc(st.live.error)}), retrying</span>`;
  } else {
    text = `<span class="dot off"></span>${esc(st.liveStopped || "Live updates off")}`;
  }
  const notifyOn = "Notification" in window && Notification.permission === "granted";
  const btn = "Notification" in window ? `<button class="mini ${notifyOn ? "on" : ""}" data-notify="1">Desktop alerts: ${notifyOn ? "On" : "Off"}</button>` : "";
  el.innerHTML = `${text}${btn}`;
  const b = $("[data-notify]", el);
  if (b) b.onclick = async () => { if (Notification.permission !== "granted") await Notification.requestPermission(); renderLive(st); };
}
document.addEventListener("visibilitychange", () => {
  for (const st of liveBySymbol.values()) document.hidden ? renderLive(st) : liveTick(st);
});

function alert_(st, text, kind = "") {
  const box = $(".alerts", st.card);
  const row = document.createElement("div");
  row.className = `alert ${kind}`;
  row.innerHTML = `<time>${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</time>${esc(text)}`;
  box.prepend(row);
  while (box.children.length > 8) box.lastChild.remove();
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(`Stockypower · ${st.symbol}`, { body: text }); } catch {}
  }
}

// Compares the newest data with the previous update on the timeframe you're viewing.
function checkAlerts(st) {
  const tf = st.tf;
  const label = (st.tfs.find((t) => t.key === tf) || {}).label || tf;
  const bars = st.candles[tf];
  if (!bars?.length) return;
  const price = (st.candles["15m"]?.length ? st.candles["15m"] : bars).at(-1).c; // most current price
  const sha = st.calc?.[tf]?.ha?.at(-1);
  const rsi = st.calc?.[tf]?.ursi?.at(-1)?.v;
  const now = { tf, price, shaUp: sha ? sha.c >= sha.o : null, rsi };
  const prev = st.alertState;
  st.alertState = now;
  if (!prev || prev.tf !== tf) return; // first look at this timeframe: nothing to compare yet
  const a = st.analysis?.timeframes?.[tf];
  const crossed = (L) => Number.isFinite(L) && ((prev.price < L && price >= L) || (prev.price > L && price <= L));
  if (a) {
    for (const [name, L] of [["Target 1", a.target1], ["Target 2", a.target2], ["Stop loss 1", a.stop1], ["Stop loss 2", a.stop2]]) {
      if (crossed(L)) alert_(st, `${label}: price ${fmt(price)} crossed ${name} (${fmt(L)})`, /Target/.test(name) ? "up" : "dn");
    }
  }
  if (prev.shaUp !== null && now.shaUp !== null && prev.shaUp !== now.shaUp)
    alert_(st, `${label}: Smoothed HA turned ${now.shaUp ? "bullish (yellow)" : "bearish (purple)"}`, now.shaUp ? "up" : "dn");
  if (Number.isFinite(prev.rsi) && Number.isFinite(rsi)) {
    for (const [lvl, name] of [[50, "the 50 midline"], [75, "overbought 75"], [25, "oversold 25"]]) {
      if (prev.rsi < lvl && rsi >= lvl) alert_(st, `${label}: Ultra RSI rose above ${name} (${rsi.toFixed(1)})`, "up");
      if (prev.rsi > lvl && rsi <= lvl) alert_(st, `${label}: Ultra RSI fell below ${name} (${rsi.toFixed(1)})`, "dn");
    }
  }
}

// ── History & accuracy ─────────────────────────────────────────────────────
const H = { data: null, chart: null };
const pctStr = (v, digits = 0) => (v == null ? "—" : `${(v * 100).toFixed(digits)}%`);
const OUTCOME = {
  target2: ["win", "Target 2 ✓"], target1: ["win", "Target 1 ✓"], stop: ["stop", "Stopped ✗"],
  expired: ["expired", "Expired"], open: ["open", "Open"], "n/a": ["na", "n/a"], unknown: ["unknown", "No data"],
};
const outcomeBadge = (o) => { const [cls, label] = OUTCOME[o?.status] || OUTCOME.unknown; return `<span class="ob ${cls}">${label}</span>`; };
const retStr = (v) => (v == null ? "—" : `<span class="${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : ""}${v.toFixed(2)}%</span>`);
const tfLabelOf = (k) => (DEFAULT_TFS.find((t) => t.key === k) || {}).label || k;

function showView(view) {
  document.querySelectorAll(".navbtn").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  $("#historyView").hidden = view !== "history";
  $("#analyzeView").hidden = view !== "analyze";
  $("#optionsView").hidden = view !== "options";
  document.body.classList.toggle("wide", view === "options"); // the option tables need the room
  if (view === "history") loadHistoryView();
  if (view === "options" && !$("#optSymbols").value) {
    const last = $("#results .card")?._state?.symbol;
    if (last) $("#optSymbols").value = last;
    $("#optSymbols").focus();
  }
}
document.querySelectorAll(".navbtn").forEach((b) => (b.onclick = () => showView(b.dataset.view)));
document.addEventListener("click", (ev) => {
  const a = ev.target.closest(".tohist");
  if (!a) return;
  ev.preventDefault();
  $("#hSymbol").dataset.want = a.dataset.sym;
  $("#hTf").value = a.dataset.tf;
  showView("history");
});
if (!$("#hTf").options.length || $("#hTf").options.length === 1)
  $("#hTf").insertAdjacentHTML("beforeend", DEFAULT_TFS.map((t) => `<option value="${t.key}">${t.label}</option>`).join(""));
$("#hSymbol").onchange = $("#hTf").onchange = () => loadHistoryView();
$("#hOutcome").onchange = () => renderHistory();
$("#hRefresh").onclick = () => loadHistoryView();

async function loadHistoryView() {
  const want = $("#hSymbol").dataset.want;
  const symbol = want ?? $("#hSymbol").value;
  const tf = $("#hTf").value;
  $(".hstatus").textContent = "Grading Stocky's past calls against Massive prices…";
  try {
    const r = await fetch(`/api/history?symbol=${encodeURIComponent(symbol || "")}&tf=${encodeURIComponent(tf || "")}`);
    if (r.status === 405 || r.status === 404) throw new Error(OLD_SERVER);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    H.data = d;
    const sel = $("#hSymbol");
    sel.innerHTML = `<option value="">All</option>` + d.symbols.map((s) => `<option>${esc(s)}</option>`).join("");
    sel.value = symbol || "";
    delete sel.dataset.want;
    $(".hstatus").textContent = `Graded ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} against the latest Massive data.`;
    renderHistory();
  } catch (err) {
    $(".hstatus").innerHTML = `<span class="error">Couldn't load history: ${esc(err.message)}</span>`;
  }
}

function renderHistory() {
  const d = H.data;
  if (!d) return;
  const s = d.stats.overall;
  const card = (k, v, sub) => `<div class="hcard"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${sub}</div></div>`;
  $(".hcards").innerHTML = [
    card("Win rate", pctStr(s.winRate), `Target 1 before Stop loss 1 · ${s.wins} of ${s.decided} decided`),
    card("Reached Target 2", pctStr(s.target2Rate), `${s.target2} of ${s.decided} decided`),
    card("Right direction", pctStr(s.directionRate), `after the 10-bar forecast · ${s.directionChecked} checked`),
    card("Forecast high held", pctStr(s.fhHeldRate), `next bar stayed below it · ${s.fhChecked} checked`),
    card("Forecast low held", pctStr(s.flHeldRate), `next bar stayed above it · ${s.flChecked} checked`),
    card("Forecast path error", s.avgPathErrorPct == null ? "—" : `${s.avgPathErrorPct.toFixed(2)}%`, `average miss vs actual close · ${s.pathChecked} calls`),
    card("Average result", s.avgReturnPct == null ? "—" : `${s.avgReturnPct >= 0 ? "+" : ""}${s.avgReturnPct.toFixed(2)}%`, `per closed call, at T1/T2/SL1 or expiry · ${s.closed} closed`),
    card("Calls", String(s.calls), `${s.open} still open · ${s.expired} expired`),
  ].join("");

  $(".hnote").innerHTML = !s.calls
    ? `<div class="checks bad">No saved calls yet. Every Stocky run is saved on this PC, and its calls are graded here as prices come in.</div>`
    : s.decided < 20
      ? `<div class="checks bad">⚠ Only ${s.decided} call${s.decided === 1 ? " has" : "s have"} reached Target 1 or Stop loss 1 so far. That's too few to judge Stocky's accuracy: a few lucky or unlucky calls swing these numbers a lot. Treat them as a rough early read until there are at least 30.</div>`
      : "";

  const table = (title, rows, keyLabel) => {
    const entries = Object.entries(rows);
    if (!entries.length) return "";
    return `<div class="hbox"><h3>${title}</h3><table><thead><tr><th>${keyLabel}</th><th>Calls</th><th>Win rate</th><th>T2</th><th>Direction</th><th>Avg result</th></tr></thead><tbody>${entries
      .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.calls}</td><td>${pctStr(v.winRate)} <small>(${v.wins}/${v.decided})</small></td><td>${pctStr(v.target2Rate)}</td><td>${pctStr(v.directionRate)}</td><td>${v.avgReturnPct == null ? "—" : retStr(v.avgReturnPct)}</td></tr>`)
      .join("")}</tbody></table></div>`;
  };
  const tfOrder = Object.fromEntries(DEFAULT_TFS.map((t, i) => [t.key, i]));
  const byTf = Object.fromEntries(Object.entries(d.stats.byTf).sort(([a], [b]) => tfOrder[a] - tfOrder[b]).map(([k, v]) => [tfLabelOf(k), v]));
  const byChecks = Object.fromEntries(Object.entries(d.stats.byChecks).map(([k, v]) => [k === "passed" ? "Checks passed" : "Checks warned", v]));
  $(".hgrid").innerHTML = table("By timeframe", byTf, "Timeframe") + table("By symbol", d.stats.bySymbol, "Symbol") + table("Accuracy checks at the time", byChecks, "Levels");

  const f = $("#hOutcome").value;
  const calls = d.calls.filter((c) => !f || (f === "win" ? ["target1", "target2"].includes(c.outcome.status) : c.outcome.status === f));
  $(".hcount").textContent = `(${calls.length})`;
  $(".hcalls").innerHTML = calls.length
    ? `<table><thead><tr><th>Made</th><th>Symbol</th><th>Timeframe</th><th>Signal</th><th>Entry</th><th>Target 1</th><th>Target 2</th><th>Stop 1</th><th>Stop 2</th><th>Outcome</th><th>Result</th><th>Bars since</th></tr></thead><tbody>${calls
        .map((c) => `<tr data-id="${esc(c.id)}"><td>${esc(new Date(c.created).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</td>
          <td>${esc(c.symbol)}</td><td>${esc(tfLabelOf(c.tf))}</td><td><span class="badge sm ${esc(c.signal)}">${esc(c.signal)}</span></td>
          <td>${fmt(c.entry)}</td><td class="t1">${fmt(c.target1)}</td><td class="t2">${fmt(c.target2)}</td><td class="s1">${fmt(c.stop1)}</td><td class="s2">${fmt(c.stop2)}</td>
          <td>${outcomeBadge(c.outcome)}</td><td>${retStr(c.outcome.returnPct)}</td><td>${c.outcome.barsElapsed ?? "—"}</td></tr>`)
        .join("")}</tbody></table>`
    : `<p class="hstatus">No calls match these filters.</p>`;
  $(".hcalls tbody")?.addEventListener("click", (ev) => {
    const tr = ev.target.closest("tr[data-id]");
    if (tr) openCall(tr.dataset.id);
  });
  $(".hhow").innerHTML =
    `How calls are graded: <b>Won</b> = price reached Target 1 before Stop loss 1 (Target 2 if it went on to reach it before the stop). ` +
    `<b>Stopped</b> = Stop loss 1 came first; a bar that touched both counts as stopped (the cautious reading). ` +
    `<b>Expired</b> = neither within ${d.resolveBars} bars; result taken at that bar's close. <b>Open</b> = still running. ` +
    `<b>Right direction</b> = price moved the way Stocky said after the 10-bar forecast. Results are % moves from the entry price, before costs. ` +
    `Everything is graded on the same regular-hours Massive bars the chart uses.`;
}

async function openCall(id) {
  const box = $(".hdetail");
  box.innerHTML = `<div class="hstatus">Loading this call…</div>`;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  try {
    const r = await fetch(`/api/history/call?id=${encodeURIComponent(id)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    renderCall(d);
  } catch (err) {
    box.innerHTML = `<div class="error">Couldn't load this call: ${esc(err.message)}</div>`;
  }
}

function renderCall(d) {
  const c = d.call, o = c.outcome;
  const box = $(".hdetail");
  const when = new Date(c.created).toLocaleString();
  const what = {
    target2: `Price reached Target 1 and then Target 2 (${fmt(c.target2)}) before Stop loss 1.`,
    target1: `Price reached Target 1 (${fmt(c.target1)}) before Stop loss 1.`,
    stop: `Price hit Stop loss 1 (${fmt(c.stop1)}) first.`,
    expired: `Neither Target 1 nor Stop loss 1 was reached within ${d.resolveBars} bars.`,
    open: `Still open: neither Target 1 nor Stop loss 1 has been reached yet (${o.barsElapsed} bars so far).`,
  }[o.status] || "This call couldn't be graded.";
  box.innerHTML = `
    <button class="mini close">Close</button>
    <div class="card-head"><div class="sym">${esc(c.symbol)}</div><span class="badge sm ${esc(c.signal)}">${esc(c.signal)}</span>
      <span style="color:var(--muted)">${esc(tfLabelOf(c.tf))} · made ${esc(when)}${c.confidence != null ? ` · confidence ${c.confidence}%` : ""}</span> ${outcomeBadge(o)} ${retStr(o.returnPct)}</div>
    <p class="summary">${esc(what)}${o.directionOk != null ? ` After the 10-bar forecast, price had moved ${o.directionOk ? "the way Stocky said" : "against Stocky's call"}.` : ""}
      ${o.fhHeld != null ? ` The next bar ${o.fhHeld ? "stayed below" : "went above"} the forecast high${o.flHeld != null ? ` and ${o.flHeld ? "stayed above" : "went below"} the forecast low` : ""}.` : ""}
      ${o.pathErrorPct != null ? ` The forecast path missed the actual closes by ${o.pathErrorPct.toFixed(2)}% on average.` : ""}</p>
    ${c.rationale ? `<p class="rationale">Stocky's reasoning then: ${esc(c.rationale)}</p>` : ""}
    ${c.checkIssues?.length ? `<p class="rationale">⚠ Accuracy checks at the time: ${esc(c.checkIssues.join(" "))}</p>` : c.checksPassed ? `<p class="rationale">✓ All accuracy checks passed at the time.</p>` : ""}
    <div class="levels" style="margin-top:8px">${[
      lvBox("", "Entry", c.entry, null, ""), lvBox("t1", "Target 1", c.target1, c.entry), lvBox("t2", "Target 2", c.target2, c.entry),
      lvBox("s1", "Stop loss 1", c.stop1, c.entry), lvBox("s2", "Stop loss 2", c.stop2, c.entry),
      lvBox("fh", "Forecast high", c.forecast_high, c.entry), lvBox("fl", "Forecast low", c.forecast_low, c.entry),
      lvBox("", o.status === "open" ? "Price now" : "Exit", o.status === "open" ? o.lastPrice : o.exitPrice, c.entry),
    ].join("")}</div>
    <div class="dchart"></div>
    <div class="keys"><span><i style="background:#8b949e"></i>Entry (when Stocky made the call)</span><span><i style="background:#3fb950"></i>Targets</span><span><i style="background:#f85149"></i>Stops</span>${c.forecast?.length ? `<span><i style="background:#58a6ff"></i>Stocky's forecast at the time</span>` : ""}</div>`;
  $(".close", box).onclick = () => { if (H.chart) H.chart.remove(); H.chart = null; box.innerHTML = ""; };
  drawCallChart($(".dchart", box), d);
}

function drawCallChart(el, d) {
  const LW = window.LightweightCharts;
  if (H.chart) { H.chart.remove(); H.chart = null; }
  if (!LW || !d.bars.length) { el.innerHTML = `<div class="nochart">No price data for this call.</div>`; return; }
  const c = d.call, o = c.outcome;
  const chart = LW.createChart(el, {
    autoSize: true,
    layout: { background: { type: "solid", color: "#0d1117" }, textColor: "#8b949e", fontSize: 11, attributionLogo: false },
    grid: { vertLines: { visible: false }, horzLines: { color: "#161b22" } },
    rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false, timeVisible: ["15m", "1h", "4h"].includes(c.tf), rightOffset: 4 },
    crosshair: { mode: LW.CrosshairMode.Normal },
  });
  H.chart = chart;
  const data = cleanPoints(d.bars.map((b) => ({ time: toET(b.t), open: b.o, high: b.h, low: b.l, close: b.c })));
  const callTime = toET(c.asOfT);
  // Bars after the call are drawn brighter than the bars Stocky had seen.
  const candles = chart.addSeries(LW.CandlestickSeries, { borderVisible: false, priceLineVisible: false, lastValueVisible: false });
  candles.setData(data.map((p) => {
    const up = p.close >= p.open, after = p.time > callTime;
    const col = up ? (after ? "#2ee65a" : "rgba(46,230,90,0.35)") : after ? "#f23645" : "rgba(242,54,69,0.35)";
    return { ...p, color: col, wickColor: col, borderColor: col };
  }));
  const quiet = { priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };
  // Smoothed HA candles for context.
  if (d.calc?.ha?.length) {
    const sha = chart.addSeries(LW.CandlestickSeries, { ...quiet, borderVisible: false });
    sha.setData(cleanPoints(d.calc.ha.map((p) => ({ time: toET(p.t), open: p.o, high: p.h, low: p.l, close: p.c }))).map((p) => {
      const col = p.close >= p.open ? "rgba(230,216,76,0.55)" : "rgba(108,76,184,0.6)";
      return { ...p, color: col, wickColor: col, borderColor: col };
    }));
  }
  for (const [title, price, color, style] of [
    ["Entry", c.entry, "#8b949e", LW.LineStyle.Dotted], ["TP1", c.target1, "#3fb950", LW.LineStyle.Dashed], ["TP2", c.target2, "#56d364", LW.LineStyle.Dashed],
    ["SL1", c.stop1, "#f85149", LW.LineStyle.Dashed], ["SL2", c.stop2, "#ff7b72", LW.LineStyle.Dashed],
  ]) if (Number.isFinite(price)) candles.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title });
  if (c.forecast?.length) {
    const path = cleanPoints([{ time: callTime, value: c.entry }, ...c.forecast.filter((f) => f.price != null).map((f) => ({ time: toET(f.t), value: f.price }))]);
    if (path.length > 1) chart.addSeries(LW.LineSeries, { ...quiet, color: "#58a6ff", lineWidth: 2, lineStyle: LW.LineStyle.Dashed, pointMarkersVisible: true }).setData(path);
  }
  const times = new Set(data.map((p) => p.time));
  const markers = [];
  if (times.has(callTime)) markers.push({ time: callTime, position: c.signal === "BUY" ? "belowBar" : "aboveBar", shape: c.signal === "BUY" ? "arrowUp" : "arrowDown", color: "#c9d1d9", text: `${c.signal} call` });
  if (o.hitT && times.has(toET(o.hitT))) {
    const win = o.status === "target1" || o.status === "target2";
    markers.push({ time: toET(o.hitT), position: "aboveBar", shape: "circle", color: win ? "#3fb950" : o.status === "stop" ? "#f85149" : "#8b949e", text: OUTCOME[o.status][1] });
  }
  if (markers.length && LW.createSeriesMarkers) LW.createSeriesMarkers(candles, markers.sort((a, b) => a.time - b.time));
  chart.timeScale().fitContent();
}
