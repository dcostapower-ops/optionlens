// Live: re-scan the real-time options feed every OPT.seconds while results are on screen.
const OPT = { seconds: 60, timer: null, query: null, busy: false, openTicker: null, updated: null, error: null };
$("#optForm").addEventListener("submit", (ev) => { ev.preventDefault(); runOptions(false); });

// Choosing the profit horizon sets sensible starting values (still editable):
// Next 5 sessions -> at / out of the money, expiring more than 21 days;
// Next 30 days -> balanced, more than 60 days. Values the user typed are left alone.
const HORIZON_DEFAULTS = { short: { days: "21", maxDays: "60", pref: "otm" }, "30d": { days: "60", maxDays: "", pref: "balanced" } };
$("#optHorizon").addEventListener("change", () => {
  const to = HORIZON_DEFAULTS[$("#optHorizon").value];
  const from = HORIZON_DEFAULTS[$("#optHorizon").value === "short" ? "30d" : "short"];
  if ($("#optDays").value === from.days) $("#optDays").value = to.days;
  if ($("#optPref").value === from.pref) $("#optPref").value = to.pref;
  if ($("#optMaxDays").value === from.maxDays) $("#optMaxDays").value = to.maxDays;
  $(".ohorizon-note").textContent = $("#optHorizon").value === "short"
    ? "Next 5 sessions: strikes default to at / out of the money and expiries to 21-60 days (you can change them). Strikes beyond Stocky's target are left out, and returns use Stocky's 5-session forecast."
    : "";
});

function optLiveOn() {
  return OPT.query && !$("#optionsView").hidden && !document.hidden;
}
function scheduleOptions() {
  clearInterval(OPT.timer);
  if (OPT.seconds > 0) OPT.timer = setInterval(() => { if (optLiveOn() && !OPT.busy) runOptions(true, true); else renderOptLive(); }, OPT.seconds * 1000);
}
function renderOptLive() {
  const el = $(".olive");
  if (!el || !OPT.query) return;
  const t = OPT.updated ? new Date(OPT.updated).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "—";
  el.innerHTML = !OPT.seconds
    ? `<span class="dot off"></span>Auto-refresh off · last updated ${t}`
    : optLiveOn()
      ? `<span class="dot"></span>Live · real-time options feed (Massive Options Advanced) · refreshes every ${OPT.seconds}s · last updated ${t}` +
        (OPT.error ? ` · <span style="color:#ff7b72">refresh failed (${esc(OPT.error)}), retrying</span>` : "")
      : `<span class="dot off"></span>Paused while this page isn't showing · last updated ${t}`;
}
document.addEventListener("visibilitychange", () => { if (optLiveOn() && !OPT.busy) runOptions(true, true); else renderOptLive(); });

const OLD_SERVER = "An older version of Stockypower is still running, so this feature isn't available yet. Close every Stockypower window (the black windows), then double-click start.bat.";

async function runOptions(refresh, silent = false) {
  const symbols = silent ? OPT.query.symbols : $("#optSymbols").value.trim();
  if (!symbols) return;
  const days = silent ? OPT.query.days : Number($("#optDays").value) || 60;
  const maxDays = silent ? OPT.query.maxDays : Number($("#optMaxDays").value) || null;
  const touchRaw = $("#optTouch").value;
  const minTouchPct = silent ? OPT.query.minTouchPct : touchRaw === "" ? 70 : Math.max(0, Math.min(100, Number(touchRaw)));
  if (!silent) {
    OPT.query = { symbols, days, maxDays, minTouchPct, autoStocky: $("#optAutoStocky").checked, horizon: $("#optHorizon").value, shortSource: $("#optSource").value, strikePref: $("#optPref").value, minOpenInterest: $("#optOI").value === "" ? 500 : Number($("#optOI").value) };
    OPT.openTicker = null;
    $(".ostatus").textContent = "Scanning every option contract and scoring them… (large chains can take 10–30 seconds)";
    $(".oresults").innerHTML = "";
    $(".ounder").innerHTML = "";
  }
  OPT.busy = true;
  try {
    const r = await fetch("/api/options", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbols, minDays: days + 1, maxDays, minTouchPct, strikePref: OPT.query.strikePref, minOpenInterest: OPT.query.minOpenInterest, horizon: OPT.query.horizon, shortSource: OPT.query.shortSource, autoStocky: OPT.query.autoStocky, refresh }), // "more than N days"
    });
    if (r.status === 405 || r.status === 404) throw new Error(OLD_SERVER);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    OPT.updated = d.at;
    OPT.error = null;
    renderOptions(d, days);
    scheduleOptions();
  } catch (err) {
    if (silent) OPT.error = err.message;
    else $(".ostatus").innerHTML = `<span class="error">${esc(err.message)}</span>`;
  } finally {
    OPT.busy = false;
    renderOptLive();
  }
}

// Earnings / events the options market is pricing (from the IV term structure).
const shortDate = (iso) => (iso ? new Date(iso + "T12:00:00Z").toLocaleDateString([], { month: "short", day: "numeric" }) : "today");
function eventLine(u) {
  if (!u.events?.length) return u.eventTerm?.length >= 4 ? `<div class="d">No earnings-type event priced in the next ${Math.round(u.eventTerm.at(-1).days)} days.</div>` : "";
  return u.events.map((e) => `<div class="d" style="color:#e3b341">⚠ The options price an event (likely earnings) between ${esc(shortDate(e.after))} and ${esc(shortDate(e.by))}: about ±${e.movePct.toFixed(1)}% on the day. Returns include the jump and the IV drop after it.</div>`).join("");
}

// What the background Stocky run for a symbol is doing.
function stockyRunLine(sym, u, d) {
  const r = (d.stockyRuns || {})[sym];
  const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? "just now" : `${m} min ago`; };
  if (r?.state === "running") return `<div class="d" style="color:var(--accent,#58a6ff)">⟳ Stocky is analysing ${esc(sym)} now (started ${ago(r.startedAt)}, usually a few minutes)${r.message ? ` · ${esc(r.message)}` : ""}. The picks update by themselves when it's done.</div>`;
  if (r?.state === "queued") return `<div class="d" style="color:var(--accent,#58a6ff)">⟳ Stocky run for ${esc(sym)} queued; it starts when another symbol's run finishes.</div>`;
  if (r?.state === "failed" && !u.stockyFresh) return `<div class="d" style="color:#ff7b72">Automatic Stocky run failed ${ago(r.finishedAt)} (${esc(r.error || "unknown error")}); it will retry in 30 minutes, or run it on the Analyze page.</div>`;
  if (r?.state === "done") return `<div class="d">Stocky's analysis was run automatically ${ago(r.finishedAt)}.</div>`;
  if (!u.stockyFresh && d.autoStocky === false) return `<div class="d">Stocky's analysis isn't from the latest trading day. Tick "Run Stocky automatically" or run it on the Analyze page.</div>`;
  return "";
}

function renderOptions(d, days) {
  const at = new Date(d.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const rej = Object.entries(d.stats.rejected || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${v.toLocaleString()} ${k}`).join(", ");
  $(".ostatus").innerHTML =
    `<div class="livebar olive"></div>` +
    `${d.cached ? "Showing results from " : "Scanned at "}${at}: ${d.stats.scanned.toLocaleString()} contracts expiring more than ${days} days out, ` +
    `${d.stats.passed.toLocaleString()} passed the liquidity and delta filters${rej ? ` (left out: ${esc(rej)})` : ""}. ` +
    `<button class="mini" id="optAgain">Refresh now</button> <button class="mini" id="optCheck" title="Re-verify these results against Massive and recompute every number independently">Run self-check</button>` +
    (Object.values(d.underlying || {}).some((u) => u.marketOpen === false)
      ? `<div class="d" style="color:#e3b341;margin-top:6px">⚠ <b>Indicative only: the market is closed.</b> Option quotes are frozen at the last close and will reprice at the open, especially if the stock moved after hours. Re-check the picks once the market has been open for 15-30 minutes and spreads have settled.</div>`
      : "") +
    (d.errors?.length ? `<div class="error">${esc(d.errors.join(" · "))}</div>` : "");
  $("#optAgain").onclick = () => runOptions(true);
  $("#optCheck").onclick = () => runSelfCheck();
  $(".ounder").innerHTML = Object.entries(d.underlying || {})
    .map(([sym, u]) => `<div class="hcard"><div class="k">${esc(sym)}${u.marketOpen === false ? ` · market closed, using the ${esc(u.closeDate || "")} close` : ""}</div><div class="v">${fmt(u.price)}</div>
      ${u.extendedPrice ? `<div class="d">After-hours / pre-market: <b>${fmt(u.extendedPrice)}</b> (${u.extendedPrice >= u.price ? "+" : ""}${(((u.extendedPrice - u.price) / u.price) * 100).toFixed(2)}%). Options don't trade then, so their prices are from the close and everything here is calculated on the ${fmt(u.price)} close.</div>` : ""}<div class="d">realized volatility: 30-day ${u.hv != null ? (u.hv * 100).toFixed(1) + "%" : "—"} · 1-year ${u.hvLong != null ? (u.hvLong * 100).toFixed(1) + "%" : "—"} · ${u.contracts.toLocaleString()} contracts</div>
      <div class="d">${u.stocky ? `Stocky (${esc(new Date(u.stocky.at).toLocaleDateString([], { month: "short", day: "numeric" }))}): ${["1h", "4h", "1D", "1W"].map((k) => `${k} <b>${esc(u.stocky.tfs?.[k]?.signal || (k === "1D" ? u.stocky.d1 : k === "1W" ? u.stocky.w1 : null) || "—")}</b>`).join(" · ")}` : `No Stocky analysis in the last 7 days, so "agrees with Stocky" isn't scored yet.`}</div>
      ${u.trendWarning ? `<div class="d" style="color:#e3b341">⚠ ${esc(u.trendWarning)}.</div>` : ""}
      ${u.priceAgainst ? `<div class="d" style="color:#ff7b72">⚠ Price moving against Stocky's ${esc(u.priceAgainst.tf)} ${esc(u.priceAgainst.signal)}: ${fmt(u.priceAgainst.px)} vs ${fmt(u.priceAgainst.entry)} when it ran (${u.priceAgainst.movePct >= 0 ? "+" : ""}${u.priceAgainst.movePct.toFixed(2)}%). 5-session picks are on hold until a fresh run.</div>` : ""}
      ${eventLine(u)}
      ${stockyRunLine(sym, u, d)}</div>`)
    .join("");

  const multi = (d.symbols || []).length > 1;
  const hz = d.horizon || {};
  const table = (title, list, type) => {
    const h = hz[type] || {};
    const note = h.mode === "short"
      ? `<p class="hhow">Ranked on the next 5 sessions using Stocky's <b>${h.source === "4h" ? "4-hour" : h.source === "1h" ? "1-hour" : "1-day"}</b> view${h.source === "4h" ? " (its 1-hour call agrees or is neutral)" : h.source === "1h" ? " (your choice: the most recent)" : " (no 4-hour result in its run)"}. Target 1 is <b>${fmt(h.target)}</b>${h.forecast ? ` and its forecast for 5 sessions ahead is <b>${fmt(h.forecast.price)}</b>${h.forecast.low && h.forecast.high ? ` (range ${fmt(h.forecast.low)}–${fmt(h.forecast.high)})` : ""}` : ""}. ` +
        (h.forecast
          ? `"Est. return" is the expected return if Stocky's forecast is right: each option is repriced across the forecast range (taken as about one standard deviation) and averaged.` +
            (h.forecast.extended ? ` The ${h.source === "1h" ? "1-hour" : ""} forecast only reaches about ${(h.forecast.daysAhead * 5 / 7).toFixed(1)} sessions ahead, so from its last point to the 5th session the price is held flat with the stock's normal volatility added.` : "")
          : `Stocky's saved run has no forecast path, so "Est. return" uses the target: chance of reaching it × return if it does, plus the rest × return if the stock stays flat.`) +
        `${h.skipped ? ` Not included: ${esc(h.skipped)}.` : ""}</p>`
      : "";
    if (!list.length)
      return h.mode === "none"
        ? `<div class="hbox" style="margin-bottom:14px"><h3>${title}</h3><p class="hstatus">No 5-session ${type} trade: ${esc(h.reason)}.</p></div>`
        : `<div class="hbox" style="margin-bottom:14px"><h3>${title}</h3>${note}<p class="hstatus">No ${type}s passed the filters.</p></div>`;
    const rows = list.map((c, i) => {
      const exp = new Date(c.expiration + "T12:00:00Z").toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
      return `<tr data-i="${i}" data-type="${type}">
        <td class="rank">${i + 1}</td>
        <td><b>${multi ? esc(c.underlying) + " " : ""}${fmt(c.strike)} ${type === "call" ? "Call" : "Put"}</b><br><small title="Strike vs stock price. ATM = strike within 2% of the price">${c.moneyness}${c.moneyness === "ATM" ? "" : ` ${c.moneynessPct.toFixed(1)}%`}</small></td>
        <td><b>${esc(exp)}</b><br><small>${c.dte} days</small>${c.event ? `<br><small style="color:#e3b341" title="Event priced between ${esc(shortDate(c.event.after))} and ${esc(shortDate(c.event.by))}, about ±${c.event.movePct.toFixed(1)}%">${c.event.beforeExit === "yes" ? `⚠ event before your ${c.event.exitDays}-day exit` : c.event.beforeExit === "maybe" ? `⚠ event may fall before your ${c.event.exitDays}-day exit` : "event after your exit"} · IV then ${(c.event.ivExit * 100).toFixed(0)}% (now ${(c.iv * 100).toFixed(0)}%)</small>` : ""}</td>
        <td><b>$${fmt(c.ask)}</b> <small>/share</small><br><small>$${c.costPerContract.toFixed(0)} per contract · bid ${fmt(c.bid)}</small><br><small>${c.premiumVsFair != null ? `${c.premiumVsFair.toFixed(2)}× fair value · ` : ""}time value ${c.timeValuePerDayPct.toFixed(3)}%/day</small></td>
        <td class="ret">${retStr(c.rankReturnPct ?? c.projectedReturnPct)}${c.shortTerm && c.weightSet === "short"
          ? `<br><small style="font-weight:400">${c.shortTerm.method === "forecast"
              ? `at Stocky's forecast ${fmt(c.shortTerm.forecastPrice)}: ${retStr(c.shortTerm.retAtForecastPct)}<br>${Math.round(c.shortTerm.pProfit * 100)}% chance in profit after 5 sessions<br>`
              : ""}target ${fmt(c.shortTerm.target)} hit: ${retStr(c.shortTerm.retTargetPct)} (${Math.round(c.shortTerm.pReach * 100)}% chance)<br>flat 5 sessions: ${retStr(c.shortTerm.retFlatPct)}</small>` : ""}</td>
        <td>${retStr(c.flatReturnPct)}</td>
        <td>${c.delta.toFixed(2)}</td>
        <td>${(c.iv * 100).toFixed(1)}%<br><small>${c.ivVsHv != null ? c.ivVsHv.toFixed(2) + "× realized" : ""}</small></td>
        <td>${c.openInterest.toLocaleString()}</td>
        <td>${c.volume.toLocaleString()}</td>
        <td>${c.spreadPct.toFixed(1)}%</td>
        <td>${c.otm ? `<b>${Math.round(c.touchProb * 100)}%</b>` : `<small>already ${c.moneyness === "ATM" ? "at" : "in"} the money</small>`}</td>
        <td>${fmt(c.breakeven)}<br><small>${c.breakevenMovePct >= 0 ? "+" : ""}${c.breakevenMovePct.toFixed(1)}% by expiry</small><br><small>${c.beProb != null ? `${Math.round(c.beProb * 100)}% chance to finish beyond` : ""}</small></td>
        <td>${Math.round(c.score * 100)}</td></tr>`;
    }).join("");
    return `<div class="hbox" style="margin-bottom:14px"><h3>${title}</h3>${note}<div class="tablewrap"><table class="otable"><thead><tr>
      <th>#</th><th>Contract</th><th>Expiry</th>
      <th title="Ask price per share; x100 per contract. Time value per day = (premium minus intrinsic value) / days to expiry, as % of the stock price">Premium</th>
      <th title="30-day horizon: return if the stock makes a typical favourable move (1 standard deviation) in 30 days. 5-session horizon: expected return from Stocky's 1-day target">Est. return*</th>
      <th title="Return if the stock is unchanged after 30 days (time decay)">If flat 30d</th><th>Delta</th><th>IV</th>
      <th>Open interest</th><th>Volume</th><th>Spread</th><th title="Chance the stock reaches the strike at any time before expiry (out-of-the-money contracts), based on its realized volatility">Reach strike before expiry</th><th title="Breakeven at expiry, and the chance the stock finishes beyond it (the option pays off if held to expiry)">Breakeven</th><th title="Combined attractiveness score, 0-100">Score</th>
      </tr></thead><tbody>${rows}</tbody></table></div></div>`;
  };
  // Per-expiry comparison: the best call / put on every expiry date and why it scored as it did.
  const expTable = (title, list) => {
    if (!list?.length) return "";
    const pct0 = (v) => Math.round(v * 100);
    return `<h3 class="hsec">${title}</h3><div class="tablewrap"><table class="otable"><thead><tr>
      <th>Expiry</th><th>Best contract</th><th>Score</th><th>Delta</th><th>Cheap IV</th><th>Cheap premium</th><th>Chance of profit</th><th>Agrees with Stocky</th><th>Liquidity</th><th>Low time decay</th>
      <th>Premium vs fair</th><th>Est. return*</th><th>In top 5?</th></tr></thead><tbody>${list.map((c) => {
        const exp = new Date(c.expiration + "T12:00:00Z").toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
        return `<tr${c.picked ? ' class="sel"' : ""}><td><b>${esc(exp)}</b><br><small>${c.dte} days</small></td>
          <td>${(d.symbols || []).length > 1 ? esc(c.underlying) + " " : ""}${fmt(c.strike)} <small>${c.moneyness}</small><br><small>$${fmt(c.ask)} · OI ${c.openInterest.toLocaleString()}</small></td>
          <td><b>${pct0(c.score)}</b></td><td>${pct0(c.scores.delta)}</td><td>${pct0(c.scores.iv)}</td><td>${pct0(c.scores.premium)}</td>
          <td>${pct0(c.scores.profit)}</td><td>${c.scores.stocky == null ? "—" : pct0(c.scores.stocky)}</td><td>${pct0(c.scores.liquidity)}</td><td>${pct0(c.scores.decay)}</td>
          <td>${c.premiumVsFair != null ? c.premiumVsFair.toFixed(2) + "×" : "—"}</td><td>${retStr(c.rankReturnPct ?? c.projectedReturnPct)}</td><td>${c.picked ? "✓" : ""}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  };
  $(".oresults").innerHTML =
    table("Best 5 calls to buy · most profitable first", d.calls, "call") + table("Best 5 puts to buy · most profitable first", d.puts, "put") +
    `<details class="hbox" style="margin-bottom:14px"><summary><b>Compare expiry dates</b>: the best contract on every expiry date, and why dates were or weren't picked</summary>
      <p class="hhow">Factor scores are 0–100 (higher is better). Only contracts that passed the filters appear. An expiry date can be missing if none of its contracts passed.</p>
      ${expTable("Calls by expiry date", d.callsByExpiry)}${expTable("Puts by expiry date", d.putsByExpiry)}</details>`;
  $(".oresults").onclick = (ev) => {
    const tr = ev.target.closest("tr[data-i]");
    if (!tr) return;
    const c = (tr.dataset.type === "call" ? d.calls : d.puts)[+tr.dataset.i];
    const open = tr.nextElementSibling?.classList.contains("odetail");
    tr.parentElement.querySelectorAll(".odetail").forEach((x) => x.remove());
    tr.parentElement.querySelectorAll("tr.sel").forEach((x) => x.classList.remove("sel"));
    if (open && !ev.reopen) { OPT.openTicker = null; return; }
    OPT.openTicker = c.ticker;
    tr.classList.add("sel");
    const bar = (label, v) => `<span>${label}</span><span class="b"><i style="width:${Math.round(v * 100)}%"></i></span><span>${Math.round(v * 100)}</span>`;
    tr.insertAdjacentHTML("afterend", `<tr class="odetail"><td colspan="14">
      <div style="display:flex;flex-wrap:wrap;gap:24px">
        <div class="bars">${bar("Delta", c.scores.delta)}${bar("Cheap IV", c.scores.iv)}${bar("Cheap premium", c.scores.premium)}${bar("Chance of profit", c.scores.profit)}${c.scores.stocky != null ? bar("Agrees with Stocky", c.scores.stocky) : ""}${bar("Liquidity", c.scores.liquidity)}${bar("Low time decay", c.scores.decay)}${c.scores.short != null ? bar("Short-term payoff", c.scores.short) : ""}</div>
        <div style="max-width:560px;font-size:13px;line-height:1.6">
          <b>${esc(c.ticker || "")}</b><br>
          Premium $${fmt(c.ask)} per share ($${c.costPerContract.toFixed(0)} per contract): $${c.intrinsic.toFixed(2)} intrinsic value + $${c.timeValue.toFixed(2)} time value,
          which decays over ${c.dte} days, about ${c.timeValuePerDayPct.toFixed(3)}% of the stock price per day.<br>
          If ${esc(c.underlying)} moves ${c.scenario.movePct >= 0 ? "up" : "down"} ${Math.abs(c.scenario.movePct).toFixed(1)}% to about ${fmt(c.scenario.targetPrice)} within ${c.scenario.holdDays} days
          (a typical move for this stock), this option would be worth about ${retStr(c.projectedReturnPct)} on what you paid. If the stock doesn't move, it loses about
          ${Math.abs(c.flatReturnPct).toFixed(1)}% to time decay over those ${c.scenario.holdDays} days. Gamma ${Number.isFinite(c.gamma) ? c.gamma.toFixed(4) : "—"} ·
          theta ${Number.isFinite(c.theta) ? c.theta.toFixed(3) : "—"}/day · vega ${Number.isFinite(c.vega) ? c.vega.toFixed(3) : "—"}.
          The most you can lose buying this option is the premium: $${c.costPerContract.toFixed(0)} per contract.
        </div></div></td></tr>`);
  };
  // After a refresh, reopen the contract you were looking at (if it's still in the top 5).
  if (OPT.openTicker) {
    const all = [...d.calls.map((c, i) => ["call", i, c]), ...d.puts.map((c, i) => ["put", i, c])];
    const f = all.find(([, , c]) => c.ticker === OPT.openTicker);
    const tr = f && $(`.oresults tr[data-type="${f[0]}"][data-i="${f[1]}"]`);
    if (tr) $(".oresults").onclick({ target: tr, reopen: true });
  }
  renderOptLive();
  $(".ohow").innerHTML =
    `How these are chosen (strikes: <b>${esc(d.settings.strikePrefLabel)}</b>${d.settings.excludeMoneyness ? `, so ${d.settings.excludeMoneyness === "itm" ? "in-the-money" : "out-of-the-money"} strikes are left out` : ""}): ` +
    `every contract expiring more than ${days} days out${d.settings.maxDays ? ` (and within ${d.settings.maxDays} days)` : ""} must have a two-sided quote, delta between ${d.settings.deltaMin} and ${d.settings.deltaMax} ` +
    `(−${d.settings.deltaMax} to −${d.settings.deltaMin} for puts), open interest of at least ${d.settings.minOpenInterest}, volume of at least ${d.settings.minVolume}, and a bid/ask spread under ${d.settings.maxSpreadPct}%. ` +
    `That delta range spans moderately out-of-the-money to moderately in-the-money contracts (each row is labelled ITM / ATM / OTM; ATM = strike within 2% of the price); deep in-the-money and far out-of-the-money contracts are left out. ` +
    `Out-of-the-money contracts are only kept if the stock has at least a ${Math.round(d.settings.minTouchProb * 100)}% chance of reaching the strike at some point before expiry ` +
    `(probability of touch, from the stock's 30-day realized volatility and the time left). The breakeven column also shows the chance of finishing beyond breakeven at expiry. ` +
    `The rest are scored 0–100: delta (most attractive near ${d.settings.deltaSweet}) 15%, cheap IV (vs the stock's realized volatility over a matching horizon and vs the rest of the chain) 15%, ` +
    `cheap premium 15% (premium vs its fair value at that realized volatility; below 1× is cheap), chance of profit at expiry 15% (finishing beyond breakeven), ` +
    `agreement with Stocky 15% (its latest 1-day and 1-week call points the same way; left out if Stocky hasn't analysed the stock in 7 days), ` +
    `liquidity 15% (open interest, volume and spread, with full marks once comfortably tradable, ${d.settings.oiGood.toLocaleString()}+ open interest and ${d.settings.volGood}+ volume, so size alone doesn't win), ` +
    `and low time decay 10% (what a flat stock costs over 30 days). ` +
    `With the <b>Next 5 sessions</b> profit horizon, strikes beyond Stocky's 1-day Target 1 are left out (they'd still be out of the money if Stocky is right), and time to expiry matters less: a short-term payoff factor (expected return if Stocky's 1-day Target 1 is reached within 5 sessions) gets 20%, time decay drops to 5%, and IV, premium and chance of profit to 10% each. ` +
    `The 5 best calls and 5 best puts by that score are shown, at most ${d.settings.maxPerExpiry} from the same expiry date, ordered by <b>estimated return*</b>: ` +
    `the option is repriced (Black-Scholes, IV unchanged) after a typical favourable 30-day move in the stock (one standard deviation of its realized volatility), bought at the ask. ` +
    `It's an estimate for comparing contracts, not a prediction. Real results depend on the move you actually get, IV changes and fills. ` +
    `Option quotes, greeks, IV, open interest and volume come from your Massive Options Advanced real-time feed and refresh every ${OPT.seconds || "—"} seconds while this page is open.`;
}

// ── Self-check ─────────────────────────────────────────────────────────────
async function runSelfCheck() {
  if (!OPT.query) return;
  const box = $(".ocheck");
  box.innerHTML = `<div class="hbox" style="margin:10px 0"><b>Self-check running…</b> <span class="hstatus">fresh scan, then every pick re-fetched from Massive and every number recomputed independently (about 10–40 seconds)</span></div>`;
  try {
    const r = await fetch("/api/options/selfcheck", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbols: OPT.query.symbols, minDays: OPT.query.days + 1, maxDays: OPT.query.maxDays, minTouchPct: OPT.query.minTouchPct, strikePref: OPT.query.strikePref, minOpenInterest: OPT.query.minOpenInterest, horizon: OPT.query.horizon, shortSource: OPT.query.shortSource, autoStocky: OPT.query.autoStocky }),
    });
    if (r.status === 405 || r.status === 404) throw new Error(OLD_SERVER);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    renderSelfCheck(d);
    renderOptions({ ...d.result, at: d.report.at }, OPT.query.days); // show the exact scan that was checked
  } catch (err) {
    box.innerHTML = `<div class="hbox error" style="margin:10px 0">Self-check couldn't run: ${esc(err.message)}</div>`;
  }
}

function selfCheckText(d) {
  const r = d.report, when = new Date(r.at).toLocaleString();
  const lines = [
    `Stockypower self-check (Best Option Chains), app version ${d.version}, ${when}`,
    `Symbols: ${d.symbols.join(", ")} · more than ${d.settings.minDays - 1} days${d.settings.maxDays ? `, at most ${d.settings.maxDays}` : ""} · OTM min ${d.settings.minTouchPct}% to reach strike · strikes: ${d.settings.strikePref} · min open interest ${d.settings.minOpenInterest} · profit horizon: ${d.settings.horizon}`,
    `Result: ${r.counts.pass} passed, ${r.counts.warn} warnings, ${r.counts.fail} failed`,
    "",
  ];
  let area = "";
  for (const c of r.checks) {
    if (c.area !== area) { area = c.area; lines.push(`[${area}]`); }
    lines.push(`  ${c.status.toUpperCase().padEnd(4)}  ${c.item}: ${c.detail}`);
  }
  lines.push("", "Picks checked:");
  for (const c of [...d.result.calls, ...d.result.puts])
    lines.push(`  ${c.type.toUpperCase()} ${c.underlying} ${c.strike} ${c.expiration} · premium ${c.ask} · delta ${c.delta.toFixed(2)} · IV ${(c.iv * 100).toFixed(1)}% · OI ${c.openInterest} · vol ${c.volume} · score ${Math.round(c.score * 100)} · est ${c.projectedReturnPct.toFixed(1)}%`);
  return lines.join("\n");
}

function renderSelfCheck(d) {
  const r = d.report;
  const icon = { pass: "✓", warn: "⚠", fail: "✗" };
  const color = { pass: "#3fb950", warn: "#d29922", fail: "#f85149" };
  const overall = r.counts.fail ? ["fail", "Problems found"] : r.counts.warn ? ["warn", "Passed, with warnings"] : ["pass", "All checks passed"];
  const rows = r.checks.map((c) => `<tr><td style="color:${color[c.status]};font-weight:700">${icon[c.status]}</td><td>${esc(c.area)}</td><td>${esc(c.item)}</td><td style="white-space:normal;text-align:left">${esc(c.detail)}</td></tr>`).join("");
  $(".ocheck").innerHTML = `<div class="hbox" style="margin:10px 0">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <b style="color:${color[overall[0]]};font-size:16px">${icon[overall[0]]} Self-check: ${overall[1]}</b>
      <span class="hstatus">${r.counts.pass} passed · ${r.counts.warn} warnings · ${r.counts.fail} failed · ${esc(new Date(r.at).toLocaleTimeString())}</span>
      <button class="mini" id="ckCopy">Copy report</button><button class="mini" id="ckHide">Hide</button>
    </div>
    <p class="hhow">Warnings under "Live data" usually mean the market moved between the scan and the re-check, which is normal with a live feed. Failures under Filters, Maths, Selection or Coverage mean something is wrong: copy the report and send it to Claude.</p>
    <details${r.counts.fail || r.counts.warn ? " open" : ""}><summary>All ${r.checks.length} checks</summary>
      <div class="tablewrap"><table class="otable"><thead><tr><th></th><th>Area</th><th>Check</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></div></details></div>`;
  $("#ckHide").onclick = () => ($(".ocheck").innerHTML = "");
  $("#ckCopy").onclick = async () => {
    const text = selfCheckText(d);
    try { await navigator.clipboard.writeText(text); $("#ckCopy").textContent = "Copied ✓"; }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.width = "100%"; ta.rows = 12;
      $(".ocheck .hbox").append(ta); ta.select();
      $("#ckCopy").textContent = "Select the text below and copy it";
    }
  };
}

// ── Confirmations ──────────────────────────────────────────────────────────
function showConfirm(card, data) {
  const box = document.createElement("div");
  box.className = "confirm";
  box.innerHTML = `
    <div>Stocky wants to run <b>${esc(data.name)}</b>. Allow it?</div>
    ${data.input ? `<pre>${esc(JSON.stringify(data.input, null, 2))}</pre>` : ""}
    <button class="allow">Allow</button><button class="deny">Deny</button>`;
  const answer = async (result) => {
    box.querySelectorAll("button").forEach((b) => (b.disabled = true));
    await fetch("/api/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: data.sessionId, toolUseId: data.toolUseId, result }),
    });
    box.innerHTML = `<div>${result === "allow" ? "Allowed" : "Denied"}: ${esc(data.name)}</div>`;
  };
  $(".allow", box).onclick = () => answer("allow");
  $(".deny", box).onclick = () => answer("deny");
  $(".confirms", card).append(box);
}

// ── Run ────────────────────────────────────────────────────────────────────
async function analyze(symbol, refresh = false) {
  const st = newCard(symbol);
  const card = st.card;
  const status = $(".status", card);
  const raw = $(".raw", card);
  const setStatus = (m) => (status.textContent = m);

  const res = await fetch("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ symbol, refresh }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    $(".badge", card).textContent = "Error";
    status.className = "error";
    status.textContent = err.error;
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  let gotVerdict = false;

  const handle = (event, data) => {
    switch (event) {
      case "status": setStatus(data.message); break;
      case "cached": st.cachedAt = data.at; break;
      case "session": card.dataset.session = data.id; break;
      case "tool": setStatus(`Stocky is using ${data.name}…`); break;
      case "text": raw.textContent += (raw.textContent ? "\n" : "") + data.text; break;
      case "confirm": setStatus("Waiting for your approval…"); showConfirm(card, data); break;
      case "candles":
        st.candles = data.candles || {};
        st.calc = data.calc || {};
        st.candlesLoaded = true;
        if (Array.isArray(data.timeframes) && data.timeframes.length) st.tfs = data.timeframes;
        if (!st.candles[st.tf]) st.tf = st.tfs.find((t) => st.candles[t.key])?.key || st.tf;
        selectTf(st, st.tf);
        startLive(st);
        break;
      case "verdict": {
        gotVerdict = true;
        raw.textContent = data.text || raw.textContent;
        st.analysis = data.analysis;
        st.checks = data.checks || {};
        st.record = data.record || {};
        const v = data.verdict || {};
        const badge = $(".badge", card);
        if (v.signal) { badge.className = `badge ${v.signal}`; badge.textContent = v.signal; }
        else { badge.className = "badge pending"; badge.textContent = "No clear call"; }
        $(".meta", card).innerHTML = [v.confidence != null ? `Overall confidence ${v.confidence}%` : "", (st.analysis?.indicators_used || []).length ? `Indicators: ${esc(st.analysis.indicators_used.join(", "))}` : ""].filter(Boolean).join("<br>");
        $(".summary", card).textContent = v.summary || "";
        if (st.analysis?.indicator_note) $(".summary", card).textContent += ` (Stocky's note on the indicators: ${st.analysis.indicator_note})`;
        if (!Object.keys(st.analysis?.timeframes || {}).length) {
          const why = (data.diagnostics || []).join("; ");
          const box = document.createElement("div");
          box.className = "checks bad";
          box.style.marginTop = "10px";
          box.textContent = `Stocky's per-timeframe levels couldn't be read, so the chart shows candles only.${why ? ` Details: ${why}.` : ""} Stocky's full reply is below. A copy is saved in the stockypower\\data folder (last-run-${symbol}.json).`;
          $(".summary", card).after(box);
          $("details", card).open = true;
        }
        selectTf(st, st.tf);
        if (v.signal) saveHistory({ symbol, signal: v.signal, at: Date.now() });
        break;
      }
      case "error": {
        st.failed = true;
        renderLevels(st);
        $(".badge", card).className = "badge pending";
        $(".badge", card).textContent = "Error";
        const e = document.createElement("div");
        e.className = "error";
        e.textContent = data.message;
        status.after(e);
        break;
      }
      case "done": {
        const again = document.createElement("button");
        again.className = "mini";
        again.style.marginLeft = "10px";
        again.textContent = "Run again";
        again.onclick = () => analyze(symbol, true);
        if (st.cachedAt) {
          const mins = Math.max(0, Math.round((Date.now() - st.cachedAt) / 60000));
          status.className = "status done";
          setStatus(`Stocky's result from ${new Date(st.cachedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} (${mins} min ago), shown instantly.`);
          status.append(again);
          break;
        }
        if (!st.candlesLoaded) {
          st.candlesLoaded = true;
          $(".chart", card).innerHTML = `<div class="nochart">No price data arrived for the chart.${serverOutdated ? " An older Stockypower is still running: close every Stockypower window, then double-click start.bat again." : " Check the message above."}</div>`;
        }
        status.className = "status done";
        setStatus(gotVerdict ? `Done · session ${card.dataset.session || ""}` : "Finished");
        status.append(again);
        break;
      }
    }
  };

  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) !== -1) {
      const chunk = buf.slice(0, i);
      buf = buf.slice(i + 2);
      let ev = "message", data = "";
      for (const line of chunk.split("\n")) {
        if (line.startsWith("event: ")) ev = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      if (data) { try { handle(ev, JSON.parse(data)); } catch (e) { console.error(e); } }
    }
  }
}

$("#form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const symbol = $("#symbol").value.trim().toUpperCase().replace(/^\$/, "");
  if (!symbol) return;
  $("#symbol").value = "";
  try { await analyze(symbol); } catch (e) { console.error(e); }
});

// Warn if the page is newer than the server that's running (an old window left open).
let serverOutdated = false;
const LIVE = { seconds: 60, delay: 15 };
fetch("/api/config").then((r) => r.json()).then((c) => {
  if (Number.isFinite(c.liveSeconds)) LIVE.seconds = c.liveSeconds;
  if (Number.isFinite(c.delayMinutes)) LIVE.delay = c.delayMinutes;
  if (Number.isFinite(c.optionsSeconds)) OPT.seconds = c.optionsSeconds;
  if ((c.version || 0) < 6) {
    serverOutdated = true;
    const w = document.createElement("div");
    w.className = "checks bad";
    w.style.marginBottom = "16px";
    w.textContent = "An older version of Stockypower is still running, so charts won't load. Close every Stockypower window (the black windows), then double-click start.bat again.";
    $("main").prepend(w);
  }
}).catch(() => {});

renderHistory();
